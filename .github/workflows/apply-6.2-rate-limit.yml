name: Apply 6.2 Rate Limit Integration

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-6.2-rate-limit.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Integrate bounded limiter into server
        shell: python
        run: |
          from pathlib import Path

          path = Path('server/server.js')
          source = path.read_text(encoding='utf-8')

          old_import = "import { accountStore, sessionManager } from './engine/AuthService.mjs';\nimport { adminPanelHTML } from './adminPanel.mjs';"
          new_import = "import { accountStore, sessionManager } from './engine/AuthService.mjs';\nimport { BoundedWindowRateLimiter } from './engine/RateLimiter.mjs';\nimport { adminPanelHTML } from './adminPanel.mjs';"
          assert source.count(old_import) == 1, 'AuthService import anchor changed'
          source = source.replace(old_import, new_import, 1)

          old_store = "const AUTH_RATE_LIMITS = new Map();"
          new_store = "const AUTH_RATE_LIMITS = new BoundedWindowRateLimiter({\n  maxEntries: Number(process.env.AUTH_RATE_LIMIT_MAX_ENTRIES) || 10_000,\n});"
          assert source.count(old_store) == 1, 'rate-limit store anchor changed'
          source = source.replace(old_store, new_store, 1)

          old_fn = """function consumeAuthRateLimit(req, res, bucket, limit, windowMs) {\n  const now = Date.now();\n  const key = `${bucket}:${getRequestIp(req)}`;\n  let state = AUTH_RATE_LIMITS.get(key);\n  if (!state || now >= state.resetAt) state = { count: 0, resetAt: now + windowMs };\n  state.count++;\n  AUTH_RATE_LIMITS.set(key, state);\n  if (state.count <= limit) return true;\n  res.setHeader('Retry-After', String(Math.max(1, Math.ceil((state.resetAt - now) / 1000))));\n  json(res, 429, { error: 'Too many authentication attempts. Try again later.' });\n  return false;\n}"""
          new_fn = """function consumeAuthRateLimit(req, res, bucket, limit, windowMs) {\n  const key = `${bucket}:${getRequestIp(req)}`;\n  const result = AUTH_RATE_LIMITS.consume(key, { limit, windowMs });\n  if (result.allowed) return true;\n  res.setHeader('Retry-After', String(Math.max(1, Math.ceil(result.retryAfterMs / 1000))));\n  json(res, 429, { error: 'Too many authentication attempts. Try again later.' });\n  return false;\n}"""
          assert source.count(old_fn) == 1, 'consumeAuthRateLimit anchor changed'
          source = source.replace(old_fn, new_fn, 1)

          path.write_text(source, encoding='utf-8')

      - name: Install server dependencies
        run: npm ci --prefix server --no-fund

      - name: Validate server
        run: |
          npm run check --prefix server
          npm test --prefix server

      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/server.js
          git diff --cached --quiet && exit 0
          git commit -m 'feat(security): activate bounded auth rate limiting'
          git push
