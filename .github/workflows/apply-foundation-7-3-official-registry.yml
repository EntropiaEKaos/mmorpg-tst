name: Apply Foundation 7.3 Official Registry

on:
  push:
    branches: [mvp-foundation-7.0]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp-foundation-7.0
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply official registry refactor
        run: python3 tools/apply-foundation-7-3-official-registry.py
      - name: Validate registry invariants
        run: |
          grep -q "executeOfficialAction" server/engine/OfficialSystems.mjs
          grep -q "getOfficialActionService" server/engine/OfficialSystems.mjs
          ! grep -q "SERVICE_RULES" server/engine/OfficialSystems.mjs
          grep -q "OFFICIAL_ACTION_NAMES" server/engine/OfficialActionRegistry.mjs
          grep -q "official registry contains every public authoritative action exactly once" server/test/official-action-registry.test.mjs
          grep -q "registry dispatch covers every action" server/test/official-action-registry.test.mjs
      - name: Validate all gates
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          npm ci --prefix server --no-fund
          npm audit --prefix server
          npm run check --prefix server
          npm test --prefix server
      - name: Commit validated Foundation 7.3 registry
        run: |
          if git diff --quiet -- server src docs; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server src docs
          git commit -m "refactor(official): route official actions through declarative registry"
          git restore tools || true
          git fetch origin mvp-foundation-7.0
          git rebase origin/mvp-foundation-7.0
          git push origin HEAD:mvp-foundation-7.0
