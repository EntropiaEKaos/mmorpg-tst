name: Mor'ia 9.34.1 Combat Visual Proof
on:
  push:
    branches: [moria-9.28-character-i18n-ptbr]
    paths:
      - 'tools/upgrade-moria-9-34-1-visual-proof.py'
      - 'tools/upgrade-moria-9-34-1-react-events.py'
      - '.github/workflows/moria-9-34-1-visual-proof.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.28-character-i18n-ptbr
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Mor'ia 9.34.1 visual proof hardening
        run: |
          python tools/upgrade-moria-9-34-1-visual-proof.py
          python tools/upgrade-moria-9-34-1-react-events.py
      - name: Verify proof hardening and documentation
        run: |
          grep -q "'You have'" tools/upgrade-moria-9-34-1-visual-proof.py
          grep -q "moria:hud:action-bar:position" src/visualQa.tsx
          grep -q "onFocusCapture={handleEnter}" src/components/Tooltip.tsx
          grep -q "data-tooltip-portal=\"true\"" src/components/Tooltip.tsx
          grep -q "player.skills || {}" src/game/elementalScaling.ts
          grep -q "Action Bar is not visibly framed" tools/capture-moria-9-34.mjs
          grep -q "COMBOS REATIVOS" tools/capture-moria-9-34.mjs
          grep -q "ATALHO:" tools/capture-moria-9-34.mjs
          grep -q "snapshot legado" docs/MORIA_9_34_1_VISUAL_PROOF.md
      - name: Verify PT-BR source coverage
        run: python tools/audit-moria-9-28-i18n.py
      - name: Validate client
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm run build
          bytes=$(wc -c < src/components/GameScreen.tsx)
          echo "GameScreen bytes: $bytes"
          test "$bytes" -lt 170000
      - name: Validate server
        run: |
          npm ci --prefix server
          npm audit --prefix server --audit-level=high
          npm run check --prefix server
          npm test --prefix server
      - name: Install stable visual QA browser
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Capture and assert Mor'ia 9.34.1 visuals
        run: |
          rm -rf artifacts/moria-9.34-screenshots
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/moria-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/visual-qa.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/visual-qa.html >/dev/null
          node tools/capture-moria-9-34.mjs
          test -s artifacts/moria-9.34-screenshots/talents.png
          test -s artifacts/moria-9.34-screenshots/actionbar.png
          test -s artifacts/moria-9.34-screenshots/castbar.png
          test -s artifacts/moria-9.34-screenshots/dps.png
          test $(stat -c%s artifacts/moria-9.34-screenshots/actionbar.png) -gt 30000
      - name: Upload Mor'ia 9.34.1 screenshots
        uses: actions/upload-artifact@v4
        with:
          name: moria-9.34.1-screenshots
          path: artifacts/moria-9.34-screenshots/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Commit validated Mor'ia 9.34.1 pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/i18n/pt-BR.928.json src/components/Tooltip.tsx src/game/elementalScaling.ts src/visualQa.tsx tools/capture-moria-9-34.mjs docs/MORIA_9_34_1_VISUAL_PROOF.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(9.34.1): harden combat visual proof'
          git push origin HEAD:moria-9.28-character-i18n-ptbr
