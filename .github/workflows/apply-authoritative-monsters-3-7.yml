name: Apply authoritative monsters 3.7

on:
  push:
    branches: [hardening-3.1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-3.1
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply authoritative monster runtime
        run: python3 tools/apply-authoritative-monsters-3-7.py
      - name: Validate monster runtime invariants
        run: |
          grep -q "syncContentMonsters(monsterContent" server/engine/GameState.mjs
          grep -q "contentSourceId" server/engine/GameState.mjs
          grep -q "engine.syncContentMonsters(contentDB.get('monsters'))" server/server.js
          grep -q "'mapId','count','posX','posY','speed'" server/server.js
          grep -q "authoritative content monsters spawn, fight and reconcile cleanly" server/test/hardening.test.mjs
          if grep -RE "require[[:space:]]*\([[:space:]]*['\"]" src --include='*.ts' --include='*.tsx'; then
            echo "Executable CommonJS require found in browser source"
            exit 1
          fi
      - name: Validate all gates
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          npm install --prefix server --no-fund
          npm audit --prefix server
          npm run check --prefix server
          npm test --prefix server
      - name: Commit validated monster runtime
        run: |
          if git diff --quiet -- server; then
            echo "No server changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server
          git commit -m "feat(server): make admin monsters authoritative runtime content"
          git restore tools
          git fetch origin hardening-3.1
          git rebase origin/hardening-3.1
          git push origin HEAD:hardening-3.1
