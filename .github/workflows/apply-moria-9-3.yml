name: Apply Mor'ia 9.3 Visual Rewards Class Identity

on:
  push:
    branches: [moria-9.3-visual-rewards-class-identity]
    paths:
      - tools/apply-moria-9-3.py
      - .github/workflows/apply-moria-9-3.yml

permissions:
  contents: write

jobs:
  apply-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.3-visual-rewards-class-identity
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Apply 9.3 integration
        run: python3 tools/apply-moria-9-3.py
      - name: Install client dependencies
        run: npm ci
      - name: Audit client dependencies
        run: npm audit --audit-level=high
      - name: Typecheck client
        run: npm run typecheck
      - name: Build client
        run: npm run build
      - name: Install server dependencies
        run: npm ci --prefix server --no-fund
      - name: Audit server dependencies
        run: npm audit --prefix server --audit-level=high
      - name: Check server syntax
        run: npm run check --prefix server
      - name: Run full server suite
        run: npm test --prefix server
      - name: Commit validated integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/engine/GameState.mjs server/engine/ClassIdentity.mjs src/game/ServerSync.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(9.3): integrate visual rewards and class combat identities"
          git push origin HEAD:moria-9.3-visual-rewards-class-identity
