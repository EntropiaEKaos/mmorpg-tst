name: Mor'ia 9.27 Visual Capture
on:
  push:
    branches: [moria-9.27-visual-rebirth]
    paths:
      - 'tools/moria-9-27-capture.trigger'
      - '.github/workflows/capture-moria-9-27.yml'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.27-visual-rebirth
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install app
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start client
        run: |
          python3 -m http.server 4173 -d dist >/tmp/moria927-http.log 2>&1 &
          sleep 2
      - name: Capture gameplay
        run: node tools/capture-moria-9-27.mjs
      - name: Validate capture
        run: |
          test -s docs/screenshots/moria-9-27-visual-rebirth-gameplay.png
          test ! -s tmp/moria-9-27-review/browser-console.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moria-9-27-visual-rebirth-review
          path: |
            docs/screenshots/moria-9-27-visual-rebirth-gameplay.png
            tmp/moria-9-27-review/browser-console.txt
      - name: Commit screenshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/moria-9-27-visual-rebirth-gameplay.png
          git commit -m 'docs(9.27): add real visual rebirth gameplay capture'
          git push origin HEAD:moria-9.27-visual-rebirth
