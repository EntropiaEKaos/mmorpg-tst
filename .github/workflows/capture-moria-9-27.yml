name: Mor'ia 9.33 Visual Release Gate
on:
  push:
    branches: [moria-9.27-visual-rebirth]
    paths:
      - '.github/workflows/capture-moria-9-27.yml'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.27-visual-rebirth
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install app
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start client
        run: |
          python3 -m http.server 4173 -d dist >/tmp/moria933-http.log 2>&1 &
          sleep 2
      - name: Capture final visual states via real player shortcuts
        run: node tools/capture-moria-9-27.mjs
      - name: Validate captures
        run: |
          test -s docs/screenshots/moria-9-33-visual-rebirth-day.png
          test -s docs/screenshots/moria-9-33-visual-rebirth-night.png
          test -s docs/screenshots/moria-9-33-visual-rebirth-character-ui.png
          test ! -s tmp/moria-9-33-review/browser-console.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moria-9-33-visual-rebirth-review
          path: |
            docs/screenshots/moria-9-33-visual-rebirth-day.png
            docs/screenshots/moria-9-33-visual-rebirth-night.png
            docs/screenshots/moria-9-33-visual-rebirth-character-ui.png
            tmp/moria-9-33-review/browser-console.txt
            tmp/moria-9-33-review/manifest.json
      - name: Commit screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/moria-9-33-visual-rebirth-day.png docs/screenshots/moria-9-33-visual-rebirth-night.png docs/screenshots/moria-9-33-visual-rebirth-character-ui.png
          git commit -m 'docs(9.33): add final visual rebirth browser evidence'
          git push origin HEAD:moria-9.27-visual-rebirth
