name: Apply authoritative items 3.8

on:
  push:
    branches: [hardening-3.1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-3.1
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply authoritative item runtime
        run: python3 tools/apply-authoritative-items-3-8.py
      - name: Validate item runtime invariants
        run: |
          grep -q "buildEquipmentLootPool(contentItems" server/engine/Items.mjs
          grep -q "rollLoot(monster, derived.goldBonus, this.contentItems)" server/engine/GameState.mjs
          grep -q "syncContentItems(itemContent" server/engine/GameState.mjs
          grep -q "engine.syncContentItems(contentDB.get('items'))" server/server.js
          grep -q "authoritative content items override and extend the live loot pool" server/test/hardening.test.mjs
          if grep -RE "require[[:space:]]*\([[:space:]]*['\"]" src --include='*.ts' --include='*.tsx'; then
            echo "Executable CommonJS require found in browser source"
            exit 1
          fi
      - name: Validate all gates
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          npm install --prefix server --no-fund
          npm audit --prefix server
          npm run check --prefix server
          npm test --prefix server
      - name: Commit validated item runtime
        run: |
          if git diff --quiet -- server; then
            echo "No server changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server
          git commit -m "feat(server): make admin items authoritative loot content"
          git restore tools
          git fetch origin hardening-3.1
          git rebase origin/hardening-3.1
          git push origin HEAD:hardening-3.1
