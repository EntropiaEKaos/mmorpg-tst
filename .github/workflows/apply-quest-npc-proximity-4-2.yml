name: Apply quest NPC proximity 4.2

on:
  push:
    branches: [hardening-3.1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-3.1
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply authoritative quest NPC proximity
        run: python3 tools/apply-quest-npc-proximity-4-2.py
      - name: Validate quest proximity invariants
        run: |
          grep -q "getQuestNpcRequirement" server/engine/GameState.mjs
          grep -q "isNearQuestNpc" server/engine/GameState.mjs
          grep -q "Move near.*to.*this quest" server/engine/GameState.mjs
          grep -q "quest accept and completion require authoritative NPC proximity when linked" server/test/hardening.test.mjs
      - name: Validate all gates
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          npm install --prefix server --no-fund
          npm audit --prefix server
          npm run check --prefix server
          npm test --prefix server
      - name: Commit validated quest proximity
        run: |
          if git diff --quiet -- server; then
            echo "No server changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server
          git commit -m "fix(quests): enforce authoritative NPC proximity"
          git restore tools
          git fetch origin hardening-3.1
          git rebase origin/hardening-3.1
          git push origin HEAD:hardening-3.1
