name: Capture Mor'ia 9.7 Reference Review

on:
  push:
    branches:
      - moria-9.7-reference-visual-convergence
    paths:
      - .github/workflows/capture-moria-9-7-reference-review.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build game
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Install isolated browser harness
        run: |
          mkdir -p /tmp/moria-shot
          cd /tmp/moria-shot
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --no-fund --no-audit
          npx playwright install --with-deps chromium

      - name: Capture real offline gameplay
        run: |
          python3 -m http.server 4173 -d dist >/tmp/moria-http.log 2>&1 &
          cat > /tmp/moria-shot/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
          const consoleLines = [];
          page.on('console', msg => consoleLines.push(`[${msg.type()}] ${msg.text()}`));
          page.on('pageerror', err => consoleLines.push(`[pageerror] ${err.message}`));
          await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' });
          await page.getByRole('button', { name: /OFFLINE QUICK PLAY/i }).click();
          await page.waitForSelector('canvas', { state: 'visible', timeout: 15000 });
          await page.waitForTimeout(4500);
          fs.mkdirSync('/tmp/moria-capture', { recursive: true });
          await page.screenshot({ path: '/tmp/moria-capture/moria-9-7-gameplay.png', fullPage: false });
          const canvases = page.locator('canvas');
          const canvasCount = await canvases.count();
          if (canvasCount > 0) {
            const box = await canvases.first().boundingBox();
            if (box && box.width > 200 && box.height > 150) {
              await canvases.first().screenshot({ path: '/tmp/moria-capture/moria-9-7-world-canvas.png' });
            }
          }
          fs.writeFileSync('/tmp/moria-capture/browser-console.txt', consoleLines.join('\n') + `\ncanvasCount=${canvasCount}\n`);
          await browser.close();
          EOF
          cd /tmp/moria-shot
          node capture.mjs

      - name: Upload visual review
        uses: actions/upload-artifact@v4
        with:
          name: moria-9-7-reference-review
          path: /tmp/moria-capture
          if-no-files-found: error
          retention-days: 7

      - name: Self-remove capture workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/capture-moria-9-7-reference-review.yml
          git commit -m "chore(9.7): remove visual review workflow"
          git push origin HEAD:moria-9.7-reference-visual-convergence
