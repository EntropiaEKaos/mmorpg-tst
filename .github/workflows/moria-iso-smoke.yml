name: Mor'ia ISO Browser Smoke

on:
  workflow_dispatch:
    inputs:
      include_mobile:
        description: 'Run full desktop+mobile frozen regression (for release/manual QA)'
        required: false
        default: true
        type: boolean
  pull_request:
    branches: [master]
    paths:
      - 'src/game/iso-next/**'
      - 'src/App.tsx'
      - 'src/components/LoginScreen.tsx'
      - 'src/components/GameScreen.tsx'
      - 'src/game/network.ts'
      - 'src/game/ServerSync.ts'
      - 'server/server.js'
      - 'tools/smoke-moria-iso.mjs'
      - 'tools/smoke-moria-browser-keyboard-quest.mjs'
      - 'tools/smoke-moria-browser-natural-combat.mjs'
      - 'server/tools/smoke-desktop-online-quest.mjs'
      - 'docs/MORIA_DESKTOP_RELEASE_TRACK.md'
      - '.github/workflows/moria-iso-smoke.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install and build isolated candidate
        run: |
          npm ci
          npm ci --prefix server
          npm run typecheck
          npm run build
      - name: Install Chromium for real-browser journey
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Start isolated authoritative realm
        run: |
          PORT=3000 \
          MORIA_ACCOUNT_DB="$RUNNER_TEMP/moria-qa-accounts.json" \
          MORIA_PLAYER_DB="$RUNNER_TEMP/moria-qa-players.json" \
          MORIA_AUTOSAVE_MS=300000 \
          MORIA_DIAG_MOVEMENT=1 \
          MORIA_QA_SNAPSHOT_MS=125 \
          MORIA_CONTENT_DB="$RUNNER_TEMP/moria-qa-content.json" \
          node server/server.js > "$RUNNER_TEMP/moria-qa-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/moria-qa-server.pid"
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/moria-qa-server.log"
          exit 1
      - name: Certify real server quest acceptance and PlayerDB recovery over WebSocket
        env:
          MORIA_CONTENT_DB: ${{ runner.temp }}/moria-qa-content.json
          MORIA_PLAYER_DB: ${{ runner.temp }}/moria-qa-players.json
          MORIA_TEST_BASE: http://127.0.0.1:3000
        run: node server/tools/smoke-desktop-online-quest.mjs
      - name: Prove real Chromium Rat combat, XP and ground loot through desktop UI
        env:
          MORIA_CONTENT_DB: ${{ runner.temp }}/moria-qa-content.json
          MORIA_TEST_BASE: http://127.0.0.1:3000
        run: node tools/smoke-moria-browser-natural-combat.mjs
      - name: Prove desktop arrow-key walk and UI quest acceptance in Chromium
        env:
          MORIA_CONTENT_DB: ${{ runner.temp }}/moria-qa-content.json
          MORIA_TEST_BASE: http://127.0.0.1:3000
        run: node tools/smoke-moria-browser-keyboard-quest.mjs
      - name: Smoke desktop release, legacy, HTTP and WebSocket
        env:
          MORIA_DESKTOP_ONLY: ${{ (github.event_name == 'pull_request' || inputs.include_mobile == false) && '1' || '0' }}
        run: node tools/smoke-moria-iso.mjs
      - name: Print server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/moria-qa-server.log" || true
      - name: Preserve browser screenshots and failure details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moria-iso-browser-smoke
          path: artifacts/moria-iso-smoke/
          if-no-files-found: warn
          retention-days: 14
