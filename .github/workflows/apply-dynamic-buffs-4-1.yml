name: Apply dynamic buffs 4.1

on:
  push:
    branches: [hardening-3.1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-3.1
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply dynamic authoritative buffs
        run: python3 tools/apply-dynamic-buffs-4-1.py
      - name: Validate dynamic buff invariants
        run: |
          grep -Fq "['attack', 'heal', 'aoe', 'buff']" server/engine/GameState.mjs
          grep -Fq "['attack', 'heal', 'aoe', 'buff']" src/components/GameScreen.tsx
          grep -q "next.buffDuration" server/engine/GameState.mjs
          grep -q "next.buffDuration" src/components/GameScreen.tsx
          grep -q "authoritative content buff spells preserve metadata and execute without damage" server/test/hardening.test.mjs
      - name: Validate all gates
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          npm install --prefix server --no-fund
          npm audit --prefix server
          npm run check --prefix server
          npm test --prefix server
      - name: Commit validated dynamic buffs
        run: |
          if git diff --quiet -- src server; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src server
          git commit -m "feat(spells): support admin-created authoritative buffs"
          git restore tools
          git fetch origin hardening-3.1
          git rebase origin/hardening-3.1
          git push origin HEAD:hardening-3.1
