name: Apply MVP Complete 6.0

on:
  push:
    branches: [mvp-complete-6.0]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp-complete-6.0
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply official systems integration
        run: python3 tools/apply-mvp-complete-6-0.py
      - name: Normalize generated source
        run: python3 tools/fix-mvp-complete-6-0.py
      - name: Validate official invariants
        run: |
          grep -q "case 'official'" server/engine/GameState.mjs
          grep -q "official: officialSystems.exportPlayer" server/server.js
          grep -q "officialSystems.syncWorldEvents" server/server.js
          grep -q "sendOfficial(action" src/game/ServerSync.ts
          grep -q "OfficialSystemsHub" src/components/GameScreen.tsx
          grep -q "serverSync.sendOfficial('pvp_toggle')" src/components/GameScreen.tsx
          grep -q "serverSync.sendOfficial('dungeon_start'" src/components/GameScreen.tsx
          grep -q "auction removes seller item" server/test/official-systems.test.mjs
          grep -q "PvP requires both players opted in" server/test/official-systems.test.mjs
          ! grep -q "Companions are local-only until server support lands" src/components/GameScreen.tsx
          ! grep -q "Depot is local-only until server support lands" src/components/GameScreen.tsx
          ! grep -q "Auction House is local-only until server support lands" src/components/GameScreen.tsx
          ! grep -q "Coin Shop is local-only until server support lands" src/components/GameScreen.tsx
          ! grep -q "Browser world events are disabled in authoritative mode" src/components/GameScreen.tsx
          ! grep -q "Mail is local-only until server support lands" src/components/GameScreen.tsx
          ! grep -q "Server-authoritative shops are not enabled yet" src/components/GameScreen.tsx
          ! grep -q "Gem socketing is disabled online" src/components/GameScreen.tsx
          ! grep -q "Crafting is disabled online" src/components/GameScreen.tsx
      - name: Validate all gates
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          npm install --prefix server --no-fund
          npm audit --prefix server
          npm run check --prefix server
          npm test --prefix server
      - name: Commit validated MVP Complete 6.0
        run: |
          if git diff --quiet -- server src docs .gitignore .github/workflows/ci.yml; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server src docs .gitignore .github/workflows/ci.yml
          git commit -m "feat(mvp): make legacy gameplay systems authoritative online"
          git restore tools
          git fetch origin mvp-complete-6.0
          git rebase origin/mvp-complete-6.0
          git push origin HEAD:mvp-complete-6.0
