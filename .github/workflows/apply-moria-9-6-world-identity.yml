name: Apply Mor'ia 9.6 World Identity

on:
  push:
    branches: [moria-9.6-world-identity-city-editor]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !startsWith(github.event.head_commit.message, 'materialize(9.6)') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Apply guarded 9.6 integration
        run: python tools/apply-moria-9-6-world-identity.py
      - name: Install client dependencies
        run: npm ci
      - name: Audit client dependencies
        run: npm audit
      - name: Typecheck client
        run: npm run typecheck
      - name: Build client
        run: npm run build
      - name: Install server dependencies
        run: npm ci --prefix server --no-fund
      - name: Audit server dependencies
        run: npm audit --prefix server
      - name: Check server syntax
        run: npm run check --prefix server
      - name: Run complete server suite
        run: npm test --prefix server
      - name: Materialize validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/maps.ts src/game/render.ts src/components/HUD.tsx src/components/GameEditor.tsx src/components/GameScreen.tsx server/engine/World.mjs server/engine/ContentStudio.mjs server/engine/AlphaContent.mjs
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "materialize(9.6): world identity and city editor integration"
          git push origin HEAD:moria-9.6-world-identity-city-editor
