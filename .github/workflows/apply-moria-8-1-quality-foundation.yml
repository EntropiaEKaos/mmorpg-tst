name: Apply Mor'ia 8.1 Quality Foundation

on:
  push:
    branches: [moria-8.1-quality-foundation]
    paths:
      - tools/apply-moria-8-1-quality-foundation.py
      - .github/workflows/apply-moria-8-1-quality-foundation.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-8.1-quality-foundation
          fetch-depth: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Apply 8.1 decomposition
        run: python3 tools/apply-moria-8-1-quality-foundation.py

      - name: Install client dependencies
        run: npm ci

      - name: Audit client dependencies
        run: npm audit

      - name: Typecheck client
        run: npm run typecheck

      - name: Build client
        run: npm run build

      - name: Install server dependencies
        run: npm ci --prefix server --no-fund

      - name: Audit server dependencies
        run: npm audit --prefix server

      - name: Check server syntax
        run: npm run check --prefix server

      - name: Run full server suite
        run: npm test --prefix server

      - name: Commit validated 8.1 foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/serverContentAdapters.ts src/components/GameScreen.tsx server/test/client-architecture.test.mjs docs/MORIA_8_1_QUALITY_FOUNDATION.md
          git diff --cached --quiet && exit 0
          git commit -m "refactor(8.1): extract server content adapters from GameScreen"
          git fetch origin moria-8.1-quality-foundation
          git rebase origin/moria-8.1-quality-foundation
          git push origin HEAD:moria-8.1-quality-foundation
