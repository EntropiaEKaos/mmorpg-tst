name: Mor'ia 9.8 World Gameplay Depth
on:
  push:
    branches: [moria-9.8-world-gameplay-depth]
permissions:
  contents: write
jobs:
  validate-capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.8-world-gameplay-depth
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Mor'ia 9.8
        run: |
          python3 tools/apply-moria-9-8-world-depth.py
      - name: Validate client and server
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          BYTES=$(wc -c < src/components/GameScreen.tsx); echo "GameScreen bytes=$BYTES"; test "$BYTES" -le 155000
          npm ci --prefix server --no-fund
          npm audit --prefix server
          npm run check --prefix server
          npm test --prefix server
      - name: Commit validated product
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json server/package.json server/package-lock.json server/engine/LivingWorldAI.mjs server/engine/CombatDepth.mjs server/engine/InteriorSystem.mjs server/engine/WorldEventDirector.mjs server/engine/QuestFlowEngine.mjs server/engine/ContentStudio.mjs server/engine/GameState.mjs server/test/world-depth-9-8.test.mjs src/components/CityDesigner98.tsx src/components/InteriorDesigner98.tsx src/components/QuestGraphDesigner98.tsx src/components/WorldDirector98.tsx src/components/GameEditor.tsx
          git commit -m "feat(9.8): world gameplay depth" || true
          git push origin HEAD:moria-9.8-world-gameplay-depth
      - name: Install browser harness
        run: |
          mkdir -p /tmp/moria98-shot && cd /tmp/moria98-shot
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --no-fund --no-audit
          npx playwright install --with-deps chromium
      - name: Capture Mor'ia 9.8
        run: |
          python3 -m http.server 4173 -d dist >/tmp/moria98-http.log 2>&1 &
          cat > /tmp/moria98-shot/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const lines=[]; page.on('console',m=>lines.push(`[${m.type()}] ${m.text()}`)); page.on('pageerror',e=>lines.push(`[pageerror] ${e.message}`));
          await page.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'});
          await page.getByRole('button',{name:/OFFLINE QUICK PLAY/i}).click();
          await page.waitForSelector('canvas',{state:'visible',timeout:15000}); await page.waitForTimeout(3500);
          fs.mkdirSync('/tmp/moria98-capture',{recursive:true});
          await page.screenshot({path:'/tmp/moria98-capture/moria-9-8-gameplay.png'});
          await page.getByRole('button',{name:/Debug/i}).click();
          await page.getByRole('button',{name:/Game Editor/i}).click();
          await page.getByRole('button',{name:/City Designer 2\.0/i}).click(); await page.waitForTimeout(500);
          await page.screenshot({path:'/tmp/moria98-capture/moria-9-8-city-designer-2.png'});
          await page.getByRole('button',{name:/Quest Graph 9\.8/i}).click(); await page.waitForTimeout(400);
          await page.screenshot({path:'/tmp/moria98-capture/moria-9-8-quest-graph.png'});
          await page.getByRole('button',{name:/Interiors 9\.8/i}).click(); await page.waitForTimeout(400);
          await page.screenshot({path:'/tmp/moria98-capture/moria-9-8-interiors.png'});
          await page.getByRole('button',{name:/World Director 9\.8/i}).click(); await page.waitForTimeout(400);
          await page.screenshot({path:'/tmp/moria98-capture/moria-9-8-world-director.png'});
          fs.writeFileSync('/tmp/moria98-capture/browser-console.txt',lines.join('\n'));
          await browser.close();
          EOF
          cd /tmp/moria98-shot && node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: moria-9-8-world-depth-review
          path: /tmp/moria98-capture
          retention-days: 7
      - name: Remove temporary release tooling
        run: |
          git pull --rebase origin moria-9.8-world-gameplay-depth
          git rm -f .github/workflows/run-moria-9-8-world-depth.yml tools/apply-moria-9-8-world-depth.py tools/moria-9-8.trigger
          git commit -m "chore(9.8): remove temporary release tooling"
          git push origin HEAD:moria-9.8-world-gameplay-depth
