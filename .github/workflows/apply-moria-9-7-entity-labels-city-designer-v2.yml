name: Apply Mor'ia 9.7 Entity Labels City Designer V2
on:
  push:
    branches: [moria-9.7-reference-visual-convergence]
    paths:
      - '.github/workflows/apply-moria-9-7-entity-labels-city-designer-v2.yml'
permissions:
  contents: write
jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.7-reference-visual-convergence
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair temporary applicator anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/apply-moria-9-7-entity-labels-city-designer.py')
          s=p.read_text()
          old='import { drawBuilding, type Building } from \'../game/render\';'
          actual='import { drawBuilding, drawBuildingOcclusion, type Building } from \'../game/render\';'
          if old not in s: raise SystemExit('expected old applicator anchor missing')
          s=s.replace(old, actual)
          p.write_text(s)
          PY
      - name: Apply entity label and city designer pass
        run: python3 tools/apply-moria-9-7-entity-labels-city-designer.py
      - name: Validate client
        run: npm ci && npm audit && npm run typecheck && npm run build
      - name: Validate server
        run: npm ci --prefix server --no-fund && npm audit --prefix server && npm run check --prefix server && npm test --prefix server
      - name: Commit validated pass and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/apply-moria-9-7-entity-labels-city-designer.py
          rm -f .github/workflows/apply-moria-9-7-entity-labels-city-designer.yml
          rm -f .github/workflows/apply-moria-9-7-entity-labels-city-designer-v2.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(9.7): add smart entity labels and visual city authoring"
          git push origin HEAD:moria-9.7-reference-visual-convergence
