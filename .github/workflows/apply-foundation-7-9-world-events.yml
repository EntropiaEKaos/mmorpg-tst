name: Apply Persistence Durability Test Hardening

on:
  push:
    branches: [mvp-foundation-7.0]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp-foundation-7.0
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Harden persistence movement tests
        run: python3 tools/harden-persistence-adjacent-move.py
      - name: Validate persistence test hardening
        run: |
          grep -q "async function moveToAnyAdjacentTile" server/test/persistence-durability.test.mjs
          test "$(grep -c "const moved = await moveToAnyAdjacentTile(client);" server/test/persistence-durability.test.mjs)" -eq 3
          ! grep -q "player?.x === beforeX + 1" server/test/persistence-durability.test.mjs
      - name: Validate all gates
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          npm ci --prefix server --no-fund
          npm audit --prefix server
          npm run check --prefix server
          npm test --prefix server
      - name: Commit validated durability hardening
        run: |
          if git diff --quiet -- server; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server
          git commit -m "test(persistence): remove spawn-direction flakiness"
          git restore tools || true
          git fetch origin mvp-foundation-7.0
          git rebase origin/mvp-foundation-7.0
          git push origin HEAD:mvp-foundation-7.0
