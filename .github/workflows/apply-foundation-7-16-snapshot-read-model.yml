name: Apply Foundation 7.16 Snapshot Read Model

on:
  push:
    branches: [mvp-foundation-7.0]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp-foundation-7.0
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply snapshot read model wiring
        run: python3 tools/apply-foundation-7-16-snapshot-read-model.py
      - name: Validate snapshot boundaries
        run: |
          test -f server/engine/OfficialSnapshotReadModel.mjs
          grep -q "officialSnapshotReadModel" server/engine/OfficialSystems.mjs
          grep -q "return officialSnapshotReadModel.snapshot" server/engine/OfficialSystems.mjs
          ! grep -q "participants: undefined" server/engine/OfficialSystems.mjs
          ! grep -q "const inbox = this.global.mail" server/engine/OfficialSystems.mjs
          grep -q "detaches mutable runtime and catalog references" server/test/official-snapshot-read-model.test.mjs
          grep -q "server-secret mystery answers" server/test/official-snapshot-read-model.test.mjs
      - name: Validate all gates
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          npm ci --prefix server --no-fund
          npm audit --prefix server
          npm run check --prefix server
          npm test --prefix server
      - name: Commit validated Foundation 7.16 snapshot read model
        run: |
          if git diff --quiet -- server docs; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server docs
          git commit -m "refactor(official): extract snapshot read model"
          git restore tools || true
          git fetch origin mvp-foundation-7.0
          git rebase origin/mvp-foundation-7.0
          git push origin HEAD:mvp-foundation-7.0
