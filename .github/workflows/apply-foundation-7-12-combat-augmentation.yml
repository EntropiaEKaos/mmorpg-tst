name: Apply Foundation 7.12 Combat Augmentation Domain

on:
  push:
    branches: [mvp-foundation-7.0]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp-foundation-7.0
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply combat augmentation domain extraction
        run: python3 tools/apply-foundation-7-12-combat-augmentation.py
      - name: Harden combat augmentation precision tests
        run: python3 tools/harden-foundation-7-12-combat-augmentation.py
      - name: Validate combat augmentation boundaries
        run: |
          test -f server/engine/OfficialCombatAugmentationDomain.mjs
          grep -q "officialCombatAugmentationDomain" server/engine/OfficialSystems.mjs
          grep -q "return officialCombatAugmentationDomain.applyDerivedBonuses" server/engine/OfficialSystems.mjs
          grep -q "return officialCombatAugmentationDomain.getActivePet" server/engine/OfficialSystems.mjs
          grep -q "recordBestiaryKill" server/engine/OfficialSystems.mjs
          grep -q "maybeGemDrop" server/engine/OfficialSystems.mjs
          ! grep -q "for (const set of SETS)" server/engine/OfficialSystems.mjs
          ! grep -q "const chance = monster.type === 'boss'" server/engine/OfficialSystems.mjs
          grep -q "set bonuses count unique equipped pieces" server/test/official-combat-augmentation-domain.test.mjs
          grep -q "Math.abs(result.totalAttack - 110)" server/test/official-combat-augmentation-domain.test.mjs
          grep -q "bestiary uses canonical content ID" server/test/official-combat-augmentation-domain.test.mjs
      - name: Validate all gates
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          npm ci --prefix server --no-fund
          npm audit --prefix server
          npm run check --prefix server
          npm test --prefix server
      - name: Commit validated Foundation 7.12 combat augmentation domain
        run: |
          if git diff --quiet -- server src docs; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server src docs
          git commit -m "refactor(official): extract combat augmentation domain"
          git restore tools || true
          git fetch origin mvp-foundation-7.0
          git rebase origin/mvp-foundation-7.0
          git push origin HEAD:mvp-foundation-7.0
