name: ISO Next Bootstrap

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/iso-next-bootstrap.yml
      - package.json
      - package-lock.json
      - src/game/iso-next/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feat/moria-iso-next'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/moria-iso-next
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Synchronize ISO visual dependency tree
        run: |
          npm install --save-exact pixi.js@8.21.0 three@0.180.0
          npm install --save-dev --save-exact @types/three@0.180.0
      - name: Apply non-breaking audit fixes
        run: npm audit fix
      - name: Verify clean install
        run: npm ci
      - name: Verify audit
        run: npm audit
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit deterministic dependency update
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency tree already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build(iso-next): sync Pixi and Three dependency tree"
          git push origin HEAD:feat/moria-iso-next
