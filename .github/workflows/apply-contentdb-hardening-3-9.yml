name: Apply ContentDB hardening 3.9

on:
  push:
    branches: [hardening-3.1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-3.1
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply ContentDB hardening
        run: python3 tools/apply-contentdb-hardening-3-9.py
      - name: Validate ContentDB invariants
        run: |
          grep -q "export function normalizeContentData" server/engine/ContentDB.mjs
          grep -q "TYPE_ALIASES = Object.freeze({ events: 'worldEvents' })" server/engine/ContentDB.mjs
          grep -q "fs.renameSync(tempFile, this.dbFile)" server/engine/ContentDB.mjs
          grep -q "if (!this.load()) this.seedDefaults()" server/engine/ContentDB.mjs
          grep -q "ContentDB recovers from corrupt JSON and saves atomically" server/test/content-db.test.mjs
          if grep -RE "require[[:space:]]*\([[:space:]]*['\"]" src --include='*.ts' --include='*.tsx'; then
            echo "Executable CommonJS require found in browser source"
            exit 1
          fi
      - name: Validate all gates
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          npm install --prefix server --no-fund
          npm audit --prefix server
          npm run check --prefix server
          npm test --prefix server
      - name: Commit validated ContentDB hardening
        run: |
          if git diff --quiet -- server; then
            echo "No server changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server
          git commit -m "fix(server): harden content persistence and event migration"
          git restore tools
          git fetch origin hardening-3.1
          git rebase origin/hardening-3.1
          git push origin HEAD:hardening-3.1
