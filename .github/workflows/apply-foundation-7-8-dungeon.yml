name: Apply Foundation 7.8 Dungeon Domain

on:
  push:
    branches: [mvp-foundation-7.0]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp-foundation-7.0
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply dungeon domain extraction
        run: python3 tools/apply-foundation-7-8-dungeon-domain.py
      - name: Validate dungeon boundaries
        run: |
          test -f server/engine/OfficialDungeonDomain.mjs
          grep -q "officialDungeonDomain" server/engine/OfficialSystems.mjs
          grep -q "officialDungeonDomain.onMonsterKill" server/engine/OfficialSystems.mjs
          grep -q "return officialDungeonDomain.start" server/engine/OfficialSystems.mjs
          grep -q "dungeon kills are isolated by owner" server/test/official-dungeon-domain.test.mjs
          grep -q "dungeon final kill grants rewards once" server/test/official-dungeon-domain.test.mjs
      - name: Validate all gates
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          npm ci --prefix server --no-fund
          npm audit --prefix server
          npm run check --prefix server
          npm test --prefix server
      - name: Commit validated Foundation 7.8 dungeon domain
        run: |
          if git diff --quiet -- server src docs; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server src docs
          git commit -m "refactor(official): extract authoritative dungeon domain"
          git restore tools || true
          git fetch origin mvp-foundation-7.0
          git rebase origin/mvp-foundation-7.0
          git push origin HEAD:mvp-foundation-7.0
