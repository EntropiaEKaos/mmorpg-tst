name: Apply content references 4.3

on:
  push:
    branches: [hardening-3.1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-3.1
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply content reference integrity
        run: python3 tools/apply-content-references-4-3.py
      - name: Validate reference invariants
        run: |
          grep -q "objectiveKey" server/engine/ContentIntegrity.mjs
          grep -q "onMonsterKill(player.id, monster)" server/engine/GameState.mjs
          grep -q "validateContentReferences" server/server.js
          grep -q "findBlockingContentReferences" server/server.js
          grep -q "authoritative monster kills progress canonical quest targets" server/test/hardening.test.mjs
      - name: Validate all gates
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          npm install --prefix server --no-fund
          npm audit --prefix server
          npm run check --prefix server
          npm test --prefix server
      - name: Commit validated content references
        run: |
          if git diff --quiet -- server; then
            echo "No server changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server
          git commit -m "fix(content): enforce references and quest objective identity"
          git restore tools
          git fetch origin hardening-3.1
          git rebase origin/hardening-3.1
          git push origin HEAD:hardening-3.1
