name: Apply Foundation 7.1 Social Hardening

on:
  push:
    branches: [mvp-foundation-7.0]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp-foundation-7.0
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply social post-gate hardening
        run: python3 tools/harden-foundation-7-1-social.py
      - name: Validate hardening invariants
        run: |
          grep -q "MORIA_SOCIAL_DB" server/engine/SocialSystems.mjs
          grep -q "MORIA_PLAYER_DB" server/engine/PlayerDB.mjs
          grep -q "MORIA_CONTENT_DB" server/engine/ContentDB.mjs
          grep -q "MORIA_OFFICIAL_DB" server/engine/OfficialSystems.mjs
          grep -q "chatMessagesInWindow" server/server.js
          grep -q "socialActionsInWindow" server/server.js
          grep -q "party chat stays private" server/test/social-ws.test.mjs
          grep -q "server/moria-social.json" .gitignore
      - name: Validate all gates
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          npm ci --prefix server --no-fund
          npm audit --prefix server
          npm run check --prefix server
          npm test --prefix server
      - name: Commit validated Foundation 7.1 hardening
        run: |
          if git diff --quiet -- server src docs .gitignore; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server src docs .gitignore
          git commit -m "test(social): harden persistence paths rate limits and websocket privacy"
          git restore tools || true
          git fetch origin mvp-foundation-7.0
          git rebase origin/mvp-foundation-7.0
          git push origin HEAD:mvp-foundation-7.0
