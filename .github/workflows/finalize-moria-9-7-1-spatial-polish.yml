name: Finalize Mor'ia 9.7.1 Spatial Polish

on:
  push:
    branches: [moria-9.7-reference-visual-convergence]
    paths: ['.github/workflows/finalize-moria-9-7-1-spatial-polish.yml']

permissions:
  contents: write

