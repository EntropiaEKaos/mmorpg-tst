name: Apply visual polish 3.5

on:
  push:
    branches: [hardening-3.1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-3.1
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare remaining ESM imports
        run: python3 tools/apply-visual-polish-3-5-fix.py
      - name: Apply visual and correctness transform
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply-visual-polish-3-5.py')
          s = p.read_text()
          marker = '# No CommonJS require() is allowed in browser source after this migration.'
          if marker not in s:
              raise SystemExit('ESM scanner marker missing')
          s = s.split(marker, 1)[0] + "print('visual polish 3.5 source transform applied')\n"
          p.write_text(s)
          PY
          python3 tools/apply-visual-polish-3-5.py
      - name: Reject executable CommonJS in browser source
        run: |
          if grep -RE "require[[:space:]]*\([[:space:]]*['\"]" src --include='*.ts' --include='*.tsx'; then
            echo "Executable CommonJS require found in browser source"
            exit 1
          fi
      - name: Validate all gates
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          npm install --prefix server --no-fund
          npm audit --prefix server
          npm run check --prefix server
          npm test --prefix server
      - name: Commit validated polish
        run: |
          if git diff --quiet; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "feat(ui): polish utility panels and fix local systems"
          git fetch origin hardening-3.1
          git rebase origin/hardening-3.1
          git push origin HEAD:hardening-3.1
