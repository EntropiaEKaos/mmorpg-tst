name: Mor'ia 9.30-9.32 Visual Polish
on:
  push:
    branches: [moria-9.27-visual-rebirth]
    paths:
      - '.github/workflows/run-moria-9-30-32-visual-polish.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.27-visual-rebirth
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Apply city emissives and bump visual release
        run: |
          python tools/apply-moria-9-31-city-emissives.py
          python - <<'PY'
          import json
          from pathlib import Path
          for rel in ['package.json','package-lock.json','server/package.json','server/package-lock.json']:
              p=Path(rel); d=json.loads(p.read_text())
              if 'version' in d: d['version']='9.32.0'
              if rel.endswith('package-lock.json') and d.get('packages',{}).get('') is not None: d['packages']['']['version']='9.32.0'
              p.write_text(json.dumps(d,indent=2)+'\n')
          PY
      - run: npm ci
      - run: npm audit
      - run: npm run typecheck
      - run: npm run build
      - name: Architecture budget
        run: python -c "from pathlib import Path; p=Path('src/components/GameScreen.tsx'); print(p.stat().st_size); assert p.stat().st_size <= 155000"
      - run: npm ci --prefix server --no-fund
      - run: npm audit --prefix server
      - run: npm run check --prefix server
      - run: npm test --prefix server
      - name: Validate visual contracts
        run: |
          grep -q 'SCHOOL_FX' src/game/combatPresentation.ts
          grep -q 'applyReactionBurst' src/game/combatPresentation.ts
          grep -q 'lampGlow' src/game/cityPresentation.ts
          grep -q 'fireGlow' src/game/cityPresentation.ts
          grep -q 'crystalGlow' src/game/cityPresentation.ts
          grep -q 'Cinematic HUD polish' src/visual-rebirth.css
          grep -q 'visual-rebirth.css' src/main.tsx
      - name: Write docs
        run: |
          cat > docs/MORIA_9_30_9_32_VFX_LIGHTING_UI.md <<'EOF'
          # Mor'ia 9.30–9.32 — Combat VFX, City Lighting & HUD Polish

          ## 9.30 Combat VFX
          Authoritative combat events now select layered presentation recipes by elemental school. Damage and spell events receive core/accent/spark bursts; critical hits increase presentation shake; elemental reactions gain recognizable cross-school bursts. Damage formulas remain server-owned.

          ## 9.31 City lighting
          Lamps, braziers and crystals now emit local radial light in the existing presentation layer, improving nighttime city readability without creating collision or gameplay state.

          ## 9.32 HUD polish
          The obsidian/brass skin gains consistent hover and keyboard-focus states, richer slot depth, custom scrollbars and explicit reduced-motion behavior.
          EOF
      - name: Commit validated visual pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json server/package.json server/package-lock.json src/game/cityPresentation.ts docs/MORIA_9_30_9_32_VFX_LIGHTING_UI.md
          git commit -m 'feat(9.32): complete combat lighting and HUD visual pass'
          git push origin HEAD:moria-9.27-visual-rebirth
