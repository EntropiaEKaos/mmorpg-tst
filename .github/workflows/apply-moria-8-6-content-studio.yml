name: Apply Mor'ia 8.6 Content Studio

on:
  push:
    branches: [moria-8.6-content-studio]
    paths:
      - tools/apply-moria-8-6-content-studio.py
      - tools/fix-moria-8-6-content-studio-compat.py
      - tools/run-moria-8-6-content-studio.py
      - .github/workflows/apply-moria-8-6-content-studio.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-8.6-content-studio
          fetch-depth: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Apply 8.6 Content Studio
        run: |
          python3 tools/run-moria-8-6-content-studio.py
          python3 tools/fix-moria-8-6-content-studio-compat.py

      - name: Install client dependencies
        run: npm ci

      - name: Audit client dependencies
        run: npm audit

      - name: Typecheck client
        run: npm run typecheck

      - name: Build client
        run: npm run build

      - name: Install server dependencies
        run: npm ci --prefix server --no-fund

      - name: Audit server dependencies
        run: npm audit --prefix server

      - name: Check server syntax
        run: npm run check --prefix server

      - name: Run full server suite
        run: npm test --prefix server

      - name: Commit validated 8.6 Content Studio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/engine/ContentStudio.mjs server/engine/ContentDB.mjs server/server.js server/adminPanel.mjs server/test/content-studio-8-6.test.mjs docs/MORIA_8_6_CONTENT_STUDIO.md
          git diff --cached --quiet && exit 0
          git commit -m "feat(8.6): turn admin into authoritative content studio"
          git fetch origin moria-8.6-content-studio
          git rebase origin/moria-8.6-content-studio
          git push origin HEAD:moria-8.6-content-studio
