name: Mor'ia 9.9 Elemental Scaling
on:
  push:
    branches: [moria-9.9-elemental-scaling-tooltips]
    paths: [tools/moria-9-9.trigger]
permissions:
  contents: write
jobs:
  validate-capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.9-elemental-scaling-tooltips
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Revalidate committed Mor'ia 9.9 product
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          BYTES=$(wc -c < src/components/GameScreen.tsx); echo "GameScreen bytes=$BYTES"; test "$BYTES" -le 155000
          npm ci --prefix server --no-fund
          npm audit --prefix server
          npm run check --prefix server
          npm test --prefix server
      - name: Install browser harness
        run: |
          mkdir -p /tmp/moria99-shot && cd /tmp/moria99-shot
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --no-fund --no-audit
          npx playwright install --with-deps chromium
      - name: Capture elemental tooltip
        run: |
          python3 -m http.server 4173 -d dist >/tmp/moria99-http.log 2>&1 &
          cat > /tmp/moria99-shot/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const lines=[]; page.on('console',m=>lines.push(`[${m.type()}] ${m.text()}`)); page.on('pageerror',e=>lines.push(`[pageerror] ${e.message}`));
          await page.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'});
          await page.getByRole('button',{name:/OFFLINE QUICK PLAY/i}).click();
          await page.waitForSelector('canvas',{state:'visible',timeout:15000}); await page.waitForTimeout(2500);
          fs.mkdirSync('/tmp/moria99-capture',{recursive:true});
          const slot=page.locator('.moria-hotbar-slot').first();
          await slot.dispatchEvent('mouseover');
          await page.getByText('Influence chain',{exact:true}).waitFor({state:'visible',timeout:5000});
          await page.waitForTimeout(300);
          await page.screenshot({path:'/tmp/moria99-capture/moria-9-9-spell-tooltip.png'});
          fs.writeFileSync('/tmp/moria99-capture/browser-console.txt',lines.join('\n'));
          await browser.close();
          EOF
          cd /tmp/moria99-shot && node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: moria-9-9-elemental-tooltip-review
          path: /tmp/moria99-capture
          retention-days: 7
      - name: Remove temporary release tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin moria-9.9-elemental-scaling-tooltips
          git rm -f .github/workflows/run-moria-9-9-elemental.yml tools/apply-moria-9-9-elemental.py tools/fix-moria-9-9-legacy-energy.py tools/moria-9-9.trigger
          git commit -m "chore(9.9): remove temporary release tooling"
          git push origin HEAD:moria-9.9-elemental-scaling-tooltips
