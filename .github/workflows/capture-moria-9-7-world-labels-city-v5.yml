name: Capture Mor'ia 9.7 World Labels City V5

on:
  push:
    branches:
      - moria-9.7-reference-visual-convergence
    paths:
      - .github/workflows/capture-moria-9-7-world-labels-city-v5.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate and build game
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          test "$(wc -c < src/components/GameScreen.tsx)" -le 155000
          npm ci --prefix server --no-fund
          npm audit --prefix server
          npm run check --prefix server
          npm test --prefix server

      - name: Install isolated browser harness
        run: |
          mkdir -p /tmp/moria-shot
          cd /tmp/moria-shot
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --no-fund --no-audit
          npx playwright install --with-deps chromium

      - name: Capture gameplay and direct city designer V5
        run: |
          python3 -m http.server 4173 -d dist >/tmp/moria-http.log 2>&1 &
          cat > /tmp/moria-shot/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
          const consoleLines = [];
          page.on('console', msg => consoleLines.push(`[${msg.type()}] ${msg.text()}`));
          page.on('pageerror', err => consoleLines.push(`[pageerror] ${err.message}`));
          await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' });
          await page.getByRole('button', { name: /OFFLINE QUICK PLAY/i }).click();
          await page.waitForSelector('canvas', { state: 'visible', timeout: 15000 });
          await page.waitForTimeout(5000);
          fs.mkdirSync('/tmp/moria-capture', { recursive: true });
          await page.screenshot({ path: '/tmp/moria-capture/moria-9-7-gameplay-v5.png', fullPage: false });

          const canvases = page.locator('canvas');
          const canvasCount = await canvases.count();
          let best = null;
          for (let i = 0; i < canvasCount; i++) {
            const box = await canvases.nth(i).boundingBox();
            if (!box) continue;
            if (!best || box.width * box.height > best.box.width * best.box.height) best = { i, box };
          }
          if (best && best.box.width > 200 && best.box.height > 150) {
            await canvases.nth(best.i).screenshot({ path: '/tmp/moria-capture/moria-9-7-world-canvas-v5.png' });
          }

          await page.getByRole('button', { name: /Debug/i }).click();
          await page.getByRole('button', { name: /Game Editor \(Items\/Spells\/Maps\/NPCs\/Monsters\/Books\)/i }).click();
          await page.getByRole('button', { name: /City Designer · Live/i }).click();
          await page.waitForTimeout(1000);
          await page.getByRole('button', { name: /^BUILD$/i }).click();
          const designerMap = page.locator('.aspect-square').first();
          const box = await designerMap.boundingBox();
          if (box) await page.mouse.click(box.x + box.width * 0.62, box.y + box.height * 0.62);
          await page.waitForTimeout(500);
          await page.screenshot({ path: '/tmp/moria-capture/moria-9-7-city-designer-v5.png', fullPage: false });

          const bodyText = await page.locator('body').innerText();
          fs.writeFileSync('/tmp/moria-capture/browser-console.txt', consoleLines.join('\n') + `\ncanvasCount=${canvasCount}\ncityDesigner=${bodyText.includes('CITY DESIGNER · DIRECT MANIPULATION')}\n`);
          await browser.close();
          EOF
          cd /tmp/moria-shot
          node capture.mjs

      - name: Upload visual review V5
        uses: actions/upload-artifact@v4
        with:
          name: moria-9-7-smart-labels-city-review-v5
          path: /tmp/moria-capture
          if-no-files-found: error
          retention-days: 7

      - name: Self-remove capture workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/capture-moria-9-7-world-labels-city-v5.yml
          git commit -m "chore(9.7): remove V5 visual review workflow"
          git push origin HEAD:moria-9.7-reference-visual-convergence
