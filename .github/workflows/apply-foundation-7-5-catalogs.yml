name: Apply Foundation 7.5 Official Catalogs

on:
  push:
    branches: [mvp-foundation-7.0]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp-foundation-7.0
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply official catalog extraction
        run: python3 tools/apply-foundation-7-5-official-catalogs.py
      - name: Validate catalog boundaries
        run: |
          test -f server/engine/OfficialCatalogs.mjs
          grep -q "OFFICIAL_PETS" server/engine/OfficialCatalogs.mjs
          grep -q "MYSTERIES" server/engine/OfficialCatalogs.mjs
          grep -q "DUNGEON_WAVES" server/engine/OfficialCatalogs.mjs
          grep -q "DEFAULT_EVENTS" server/engine/OfficialCatalogs.mjs
          grep -q "from './OfficialCatalogs.mjs'" server/engine/OfficialSystems.mjs
          grep -q "official catalogs are isolated" server/test/official-catalogs.test.mjs
      - name: Validate all gates
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          npm ci --prefix server --no-fund
          npm audit --prefix server
          npm run check --prefix server
          npm test --prefix server
      - name: Commit validated Foundation 7.5 catalogs
        run: |
          if git diff --quiet -- server src docs; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server src docs
          git commit -m "refactor(official): extract immutable official catalog layer"
          git restore tools || true
          git fetch origin mvp-foundation-7.0
          git rebase origin/mvp-foundation-7.0
          git push origin HEAD:mvp-foundation-7.0
