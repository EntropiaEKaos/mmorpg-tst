name: Mor'ia 9.27 Deep Visual Revamp
on:
  push:
    branches: [moria-9.27-deep-visual-revamp]
    paths:
      - 'tools/moria-9-27.trigger'
      - '.github/workflows/run-moria-9-27-visual-revamp.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.27-deep-visual-revamp
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Apply 9.27 visual revamp
        run: python tools/apply-moria-9-27-visual-revamp.py
      - name: Install client
        run: npm ci
      - name: Audit client
        run: npm audit
      - name: Typecheck client
        run: npm run typecheck
      - name: Build client
        run: npm run build
      - name: Architecture budget
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/GameScreen.tsx')
          print(f'GameScreen bytes={p.stat().st_size}')
          assert p.stat().st_size <= 156000
          PY
      - name: Install server
        run: npm ci --prefix server --no-fund
      - name: Audit server
        run: npm audit --prefix server
      - name: Check server
        run: npm run check --prefix server
      - name: Test server
        run: npm test --prefix server
      - name: Commit validated visual product
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json server/package.json server/package-lock.json src/game/worldVisualRevamp927.ts src/game/render.ts src/game/classicEntityPresentation.ts src/components/GameScreen.tsx src/index.css server/test/visual-revamp-9-27.test.mjs
          if git diff --cached --quiet; then echo 'No product changes'; exit 0; fi
          git commit -m 'feat(9.27): deep visual revamp foundation'
          git push origin HEAD:moria-9.27-deep-visual-revamp
