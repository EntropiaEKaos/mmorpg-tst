name: Mor'ia 9.33 Items Economy PT-BR
on:
  push:
    branches: [moria-9.28-character-i18n-ptbr]
    paths:
      - 'tools/upgrade-moria-9-33-items-economy-ptbr.py'
      - '.github/workflows/moria-9-33-items-economy-ptbr.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.28-character-i18n-ptbr
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Mor'ia 9.33 items economy PT-BR
        run: python tools/upgrade-moria-9-33-items-economy-ptbr.py
      - name: Verify localized ownership and documentation
        run: |
          grep -q "tr('Drop here to throw on ground')" src/components/Inventory.tsx
          grep -q "tr('DEPOT CHEST')" src/components/Depot.tsx
          grep -q "tr('AUCTION HOUSE')" src/components/AuctionHouse.tsx
          grep -q "tr('COIN SHOP')" src/components/CoinShop.tsx
          grep -q "panel === 'auction'" src/visualQa.tsx
          grep -q "Mor'ia 9.33" docs/MORIA_9_33_ITEMS_ECONOMY_PTBR.md
          test -f tools/capture-moria-9-33.mjs
      - name: Verify PT-BR source coverage
        run: python tools/audit-moria-9-28-i18n.py
      - name: Validate client
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm run build
          bytes=$(wc -c < src/components/GameScreen.tsx)
          echo "GameScreen bytes: $bytes"
          test "$bytes" -lt 170000
      - name: Validate server
        run: |
          npm ci --prefix server
          npm audit --prefix server --audit-level=high
          npm run check --prefix server
          npm test --prefix server
      - name: Install stable visual QA browser
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Capture and assert Mor'ia 9.33 visuals
        run: |
          rm -rf artifacts/moria-9.33-screenshots
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/moria-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/visual-qa.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/visual-qa.html >/dev/null
          node tools/capture-moria-9-33.mjs
          test -s artifacts/moria-9.33-screenshots/inventory.png
          test -s artifacts/moria-9.33-screenshots/depot.png
          test -s artifacts/moria-9.33-screenshots/auction.png
          test -s artifacts/moria-9.33-screenshots/coinshop.png
      - name: Upload Mor'ia 9.33 screenshots
        uses: actions/upload-artifact@v4
        with:
          name: moria-9.33-screenshots
          path: artifacts/moria-9.33-screenshots/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Commit validated Mor'ia 9.33 pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/i18n/pt-BR.928.json src/components/Inventory.tsx src/components/Depot.tsx src/components/AuctionHouse.tsx src/components/CoinShop.tsx src/visualQa.tsx tools/capture-moria-9-33.mjs docs/MORIA_9_33_ITEMS_ECONOMY_PTBR.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(9.33): localize items economy and add visual QA'
          git push origin HEAD:moria-9.28-character-i18n-ptbr
