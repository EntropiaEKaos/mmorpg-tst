name: Apply authoritative buffs 3.7

on:
  push:
    branches: [hardening-3.1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-3.1
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply authoritative buff spells
        run: python3 tools/apply-authoritative-buffs-3-7.py
      - name: Validate buff/runtime invariants
        run: |
          grep -q "getActiveBuffs(player" server/engine/GameState.mjs
          grep -q "spell.type === 'buff'" server/engine/GameState.mjs
          grep -q "buff.type === 'invisible'" server/engine/GameState.mjs
          grep -q "authoritative buff spells apply effects without damaging monsters" server/test/hardening.test.mjs
      - name: Validate all gates
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          npm install --prefix server --no-fund
          npm audit --prefix server
          npm run check --prefix server
          npm test --prefix server
      - name: Commit validated buff fixes
        run: |
          if git diff --quiet -- server; then
            echo "No server changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server
          git commit -m "fix(combat): make buff spells authoritative"
          git restore tools
          git fetch origin hardening-3.1
          git rebase origin/hardening-3.1
          git push origin HEAD:hardening-3.1
