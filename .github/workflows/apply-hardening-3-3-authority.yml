name: Apply Hardening 3.3 authority boundary fixes

on:
  push:
    branches: [hardening-3.1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-3.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply authority patch
        run: python3 tools/apply-hardening-3-3.py
      - name: Validate client and server
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm install --prefix server --no-fund
          npm run check --prefix server
          npm test --prefix server
      - name: Commit source fixes
        run: |
          if git diff --quiet; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.js server/engine/GameState.mjs server/test/hardening.test.mjs src/game/ServerSync.ts src/components/GameScreen.tsx
          git commit -m "fix(authority): enforce portal travel and online state boundary"
          git fetch origin hardening-3.1
          git rebase origin/hardening-3.1
          git push origin HEAD:hardening-3.1
