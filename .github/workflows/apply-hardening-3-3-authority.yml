          marker = """  sendEquip(itemId: string) {
    if (!this.isActive()) return;
    sendIntent({ type: 'equip', payload: { itemId } });
  }

"""
          addition = marker + """  sendUnequip(slot: string) {
    if (!this.isActive()) return;
    sendIntent({ type: 'unequip', payload: { slot } });
  }

"""
