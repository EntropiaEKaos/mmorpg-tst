name: Visual dependency audit repair

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/legacy-eldoria-hybrid-pixi-three
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply non-breaking npm audit fixes
        run: npm audit fix
      - name: Verify clean audit
        run: npm audit
      - name: Typecheck visual branch
        run: npm run typecheck
      - name: Build visual branch
        run: npm run build
      - name: Commit lockfile repair
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "No dependency changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "chore(deps): repair client audit vulnerabilities"
          git push origin HEAD:visual/legacy-eldoria-hybrid-pixi-three
