name: Mor'ia 9.43A Grand Stormwatch Isle
on:
  push:
    branches: [moria-9.28-character-i18n-ptbr]
    paths:
      - 'tools/upgrade-moria-9-43a-grand-stormwatch-isle.py'
      - 'tools/fix-moria-9-43a-stormwatch-seed.py'
      - '.github/workflows/moria-9-43a-grand-stormwatch-isle.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.28-character-i18n-ptbr
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Mor'ia 9.43A Grand Stormwatch Isle
        run: |
          python -m py_compile tools/upgrade-moria-9-43a-grand-stormwatch-isle.py tools/fix-moria-9-43a-stormwatch-seed.py
          python tools/upgrade-moria-9-43a-grand-stormwatch-isle.py
          python tools/fix-moria-9-43a-stormwatch-seed.py
      - name: Verify 9.43A source contracts
        run: |
          set -euxo pipefail
          test -s server/engine/GrandStormwatch.mjs
          test -s server/test/grand-stormwatch-isle-9-43.test.mjs
          test -s docs/MORIA_9_43_GRAND_STORMWATCH_ISLE.md
          grep -q "GRAND_CAPITAL_SCHEMA_VERSION=9" server/engine/GrandStormwatch.mjs
          grep -q "urbanPlan:'tempest-archipelago'" server/engine/GrandStormwatch.mjs
          grep -q "tempestArchipelagoTile" server/engine/World.mjs
          grep -q "tempestArchipelagoTile" src/game/maps.ts
          grep -q "node_stormwatch" server/engine/GrandStormwatch.mjs
          grep -q "GRAND_STORMWATCH_MAP" server/engine/AlphaContent.mjs
          test $(grep -c "migrateGrandStormwatchData(this.data)" server/engine/ContentDB.mjs) -eq 2
          grep -q 'snow>2200' server/test/grand-stormwatch-isle-9-43.test.mjs
      - name: Verify PT-BR source coverage
        run: python tools/audit-moria-9-28-i18n.py
      - name: Validate client
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm run build
          bytes=$(wc -c < src/components/GameScreen.tsx)
          echo "GameScreen bytes: $bytes"
          test "$bytes" -lt 170000
      - name: Validate focused Stormwatch tests
        run: |
          npm ci --prefix server
          npm audit --prefix server --audit-level=high
          npm run check --prefix server
          node --test server/test/grand-stormwatch-isle-9-43.test.mjs
      - name: Validate full server suite
        run: npm test --prefix server
      - name: Commit validated Mor'ia 9.43A pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/engine/GrandStormwatch.mjs server/engine/AlphaContent.mjs server/engine/GrandEmberhold.mjs server/engine/GrandCrystalDeep.mjs server/engine/ContentDB.mjs server/engine/World.mjs src/game/maps.ts server/test/grand-crystal-deep-9-42.test.mjs server/test/grand-stormwatch-isle-9-43.test.mjs docs/MORIA_9_43_GRAND_STORMWATCH_ISLE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(9.43a): build authoritative Grand Stormwatch Isle'
          git push origin HEAD:moria-9.28-character-i18n-ptbr
