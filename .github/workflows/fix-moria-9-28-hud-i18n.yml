name: Mor'ia 9.28 HUD PT-BR Fix
on:
  push:
    branches: [moria-9.28-character-i18n-ptbr]
    paths:
      - 'tools/fix-moria-9-28-hud-i18n.py'
      - '.github/workflows/fix-moria-9-28-hud-i18n.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.28-character-i18n-ptbr
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply HUD PT-BR fix
        run: python tools/fix-moria-9-28-hud-i18n.py
      - name: Verify PT-BR source coverage
        run: python tools/audit-moria-9-28-i18n.py
      - name: Validate client
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm run build
          test "$(wc -c < src/components/GameScreen.tsx)" -lt 170000
      - name: Validate server
        run: |
          npm ci --prefix server
          npm audit --prefix server --audit-level=high
          npm run check --prefix server
          npm test --prefix server
      - name: Commit validated HUD fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GameScreen.tsx src/i18n/pt-BR.928.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(9.28): localize persistent HUD controls"
          git push origin HEAD:moria-9.28-character-i18n-ptbr
