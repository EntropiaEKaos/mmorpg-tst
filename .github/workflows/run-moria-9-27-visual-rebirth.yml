name: Mor'ia 9.27 Visual Rebirth
on:
  push:
    branches: [moria-9.27-visual-rebirth]
    paths:
      - 'tools/moria-9-27.trigger'
      - '.github/workflows/run-moria-9-27-visual-rebirth.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.27-visual-rebirth
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Apply visual rebirth
        run: python tools/apply-moria-9-27-visual-rebirth.py
      - name: Install client
        run: npm ci
      - name: Audit client
        run: npm audit
      - name: Typecheck client
        run: npm run typecheck
      - name: Build client
        run: npm run build
      - name: Architecture budget
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/GameScreen.tsx')
          print(f'GameScreen bytes={p.stat().st_size}')
          assert p.stat().st_size <= 155000
          PY
      - name: Install server
        run: npm ci --prefix server --no-fund
      - name: Audit server
        run: npm audit --prefix server
      - name: Check server
        run: npm run check --prefix server
      - name: Test server
        run: npm test --prefix server
      - name: Validate visual markers
        run: |
          grep -q "Mor'ia 9.27" docs/MORIA_9_27_VISUAL_REBIRTH.md
          grep -q "layered contact shadow" src/game/playerAvatar.ts
          grep -q "filmic edge treatment" src/game/worldAtmosphere.ts
          grep -q "Visual Rebirth" src/index.css
      - name: Commit validated visual product
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json server/package.json server/package-lock.json src/game/worldAtmosphere.ts src/game/playerAvatar.ts src/game/classicEntityPresentation.ts src/index.css docs/MORIA_9_27_VISUAL_REBIRTH.md
          git commit -m 'feat(9.27): begin deep visual rebirth'
          git push origin HEAD:moria-9.27-visual-rebirth
