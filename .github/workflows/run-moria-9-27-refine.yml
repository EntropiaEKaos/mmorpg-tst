name: Mor'ia 9.27 Release Closure
on:
  push:
    branches: [moria-9.27-deep-visual-revamp]
    paths:
      - '.github/workflows/run-moria-9-27-refine.yml'
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.27-deep-visual-revamp
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Prepare release documentation
        run: python tools/close-moria-9-27.py
      - name: Verify final visual evidence
        run: |
          grep -q "Mor'ia 9.27 — Deep Visual Revamp" README.md
          for f in \
            docs/screenshots/moria-9-27-login-revamp.png \
            docs/screenshots/moria-9-27-world-day.png \
            docs/screenshots/moria-9-27-world-night.png \
            docs/screenshots/moria-9-27-world-storm.png \
            docs/screenshots/moria-9-27-inventory-hud.png; do test -s "$f"; grep -q "$f" README.md; done
          test -s docs/MORIA_9_27_DEEP_VISUAL_REVAMP.md
      - run: npm ci
      - run: npm audit
      - run: npm run typecheck
      - run: npm run build
      - name: Architecture budget
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/GameScreen.tsx')
          print(f'GameScreen bytes={p.stat().st_size}')
          assert p.stat().st_size <= 158500
          PY
      - run: npm ci --prefix server --no-fund
      - run: npm audit --prefix server
      - run: npm run check --prefix server
      - run: npm test --prefix server
      - name: Remove temporary 9.27 release tooling
        run: |
          git rm -f \
            .github/workflows/capture-moria-9-27.yml \
            .github/workflows/run-moria-9-27-refine.yml \
            .github/workflows/run-moria-9-27-visual-revamp.yml \
            tools/apply-moria-9-27-visual-revamp.py \
            tools/capture927.mjs \
            tools/close-moria-9-27.py \
            tools/moria-9-27-refine.trigger \
            tools/moria-9-27.trigger \
            tools/polish-moria-9-27-atmosphere.py \
            tools/polish-moria-9-27-depth.py \
            tools/polish-moria-9-27-night-lighting.py \
            tools/refine-moria-9-27-visual.py
      - name: Commit release-ready tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/MORIA_9_27_DEEP_VISUAL_REVAMP.md
          git commit -m 'docs(9.27): finalize visual revamp release evidence'
          git push origin HEAD:moria-9.27-deep-visual-revamp
