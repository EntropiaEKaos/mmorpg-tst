name: Apply Mor'ia 8.3 Living World

on:
  push:
    branches: [moria-8.3-living-world]
    paths:
      - tools/apply-moria-8-3-living-world.py
      - .github/workflows/apply-moria-8-3-living-world.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-8.3-living-world
          fetch-depth: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Apply 8.3 living world
        run: python3 tools/apply-moria-8-3-living-world.py
      - name: Install client dependencies
        run: npm ci
      - name: Audit client dependencies
        run: npm audit
      - name: Typecheck client
        run: npm run typecheck
      - name: Build client
        run: npm run build
      - name: Install server dependencies
        run: npm ci --prefix server --no-fund
      - name: Audit server dependencies
        run: npm audit --prefix server
      - name: Check server syntax
        run: npm run check --prefix server
      - name: Run full server suite
        run: npm test --prefix server
      - name: Commit validated 8.3 living world
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/worldAtmosphere.ts src/components/RegionBanner.tsx src/components/Weather.tsx src/components/GameScreen.tsx src/index.css server/test/living-world-presentation.test.mjs docs/MORIA_8_3_LIVING_WORLD.md
          git diff --cached --quiet && exit 0
          git commit -m "feat(8.3): make Mor'ia regions feel alive"
          git fetch origin moria-8.3-living-world
          git rebase origin/moria-8.3-living-world
          git push origin HEAD:moria-8.3-living-world
