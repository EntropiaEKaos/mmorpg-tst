name: Apply admin UI hardening 4.0

on:
  push:
    branches: [hardening-3.1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-3.1
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply admin UI hardening
        run: python3 tools/apply-admin-ui-hardening-4-0.py
      - name: Validate admin UI invariants
        run: |
          grep -q "function escapeHtml(value)" server/adminPanel.mjs
          grep -q "encodeURIComponent(id)" server/adminPanel.mjs
          grep -q "editRow(' + index" server/adminPanel.mjs
          grep -q "deleteRow(' + index" server/adminPanel.mjs
          if grep -q "event.target" server/adminPanel.mjs; then
            echo "Implicit global event remains in admin panel"
            exit 1
          fi
          grep -q "admin panel escapes persisted content" server/test/admin-panel.test.mjs
          if grep -RE "require[[:space:]]*\([[:space:]]*['\"]" src --include='*.ts' --include='*.tsx'; then
            echo "Executable CommonJS require found in browser source"
            exit 1
          fi
      - name: Validate all gates
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          npm install --prefix server --no-fund
          npm audit --prefix server
          npm run check --prefix server
          npm test --prefix server
      - name: Commit validated admin UI hardening
        run: |
          if git diff --quiet -- server; then
            echo "No server changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server
          git commit -m "fix(admin): escape persisted content and harden row actions"
          git restore tools
          git fetch origin hardening-3.1
          git rebase origin/hardening-3.1
          git push origin HEAD:hardening-3.1
