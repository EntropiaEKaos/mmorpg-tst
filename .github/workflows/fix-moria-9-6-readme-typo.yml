name: Fix Mor'ia 9.6 README Typo

on:
  push:
    branches: [moria-9.6-world-identity-city-editor]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = '### 🛠️ Ferramenta de idição urbana'
          new = '### 🛠️ Ferramenta de edição urbana'
          if text.count(old) != 1:
              raise SystemExit(f'expected one typo anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          grep -q 'Ferramenta de edição urbana' README.md
      - name: Commit fix and self-remove
        run: |
          rm .github/workflows/fix-moria-9-6-readme-typo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/fix-moria-9-6-readme-typo.yml
          git commit -m "docs(9.6): fix City Designer wording"
          git push
