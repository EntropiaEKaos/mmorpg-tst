name: Apply Mor'ia 9.4 Cinematic Rewards

on:
  push:
    branches: [moria-9.4-cinematic-rewards]
    paths:
      - tools/apply-moria-9-4.py
      - .github/workflows/apply-moria-9-4.yml

permissions:
  contents: write

jobs:
  apply-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.4-cinematic-rewards
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Apply 9.4 integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply-moria-9-4.py')
          text = p.read_text(encoding='utf-8')
          redundant = '''text = replace_once(text,
              "    const voc = VOCATIONS[player.vocation];\\n    while (player.xp >= player.xpNext && voc) {\\n",
              "    const voc = VOCATIONS[player.vocation];\\n    while (player.xp >= player.xpNext && voc) {\\n",
              'kill level loop anchor')
          '''
          if redundant not in text:
              raise SystemExit('9.4 applicator safety anchor not found')
          p.write_text(text.replace(redundant, '', 1), encoding='utf-8')
          PY
          python3 tools/apply-moria-9-4.py
      - name: Install client dependencies
        run: npm ci
      - name: Audit client dependencies
        run: npm audit --audit-level=high
      - name: Typecheck client
        run: npm run typecheck
      - name: Build client
        run: npm run build
      - name: Install server dependencies
        run: npm ci --prefix server --no-fund
      - name: Audit server dependencies
        run: npm audit --prefix server --audit-level=high
      - name: Check server syntax
        run: npm run check --prefix server
      - name: Run full server suite
        run: npm test --prefix server
      - name: Commit validated integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/engine/GameState.mjs server/engine/OfficialStateSchema.mjs server/engine/OfficialProgressionDomain.mjs server/engine/OfficialSystems.mjs src/game/ServerSync.ts src/components/GameScreen.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(9.4): integrate authoritative cinematic rewards"
          git push origin HEAD:moria-9.4-cinematic-rewards
