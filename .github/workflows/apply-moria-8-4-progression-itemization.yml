name: Apply Mor'ia 8.4 Progression Itemization

on:
  push:
    branches: [moria-8.4-progression-itemization]
    paths:
      - tools/apply-moria-8-4-progression-itemization.py
      - .github/workflows/apply-moria-8-4-progression-itemization.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-8.4-progression-itemization
          fetch-depth: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Apply 8.4 progression and itemization
        run: python3 tools/apply-moria-8-4-progression-itemization.py

      - name: Install client dependencies
        run: npm ci

      - name: Audit client dependencies
        run: npm audit

      - name: Typecheck client
        run: npm run typecheck

      - name: Build client
        run: npm run build

      - name: Install server dependencies
        run: npm ci --prefix server --no-fund

      - name: Audit server dependencies
        run: npm audit --prefix server

      - name: Check server syntax
        run: npm run check --prefix server

      - name: Run full server suite
        run: npm test --prefix server

      - name: Commit validated 8.4 progression and itemization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/engine/Itemization.mjs server/engine/Items.mjs server/engine/GameState.mjs server/engine/OfficialInventoryEconomyDomain.mjs server/engine/OfficialCatalogs.mjs src/game/types.ts src/components/Tooltip.tsx server/test/itemization-8-4.test.mjs docs/MORIA_8_4_PROGRESSION_ITEMIZATION.md
          git diff --cached --quiet && exit 0
          git commit -m "feat(8.4): deepen authoritative progression and itemization"
          git fetch origin moria-8.4-progression-itemization
          git rebase origin/moria-8.4-progression-itemization
          git push origin HEAD:moria-8.4-progression-itemization
