name: Apply Mor'ia 9.2 Day Night Contextual Skills

on:
  push:
    branches: [moria-9.2-alpha-housing-outfits-mounts]
    paths:
      - tools/apply-moria-9-2-day-night-contextual-skills.py
      - .github/workflows/apply-moria-9-2-day-night-contextual-skills.yml

permissions:
  contents: write

jobs:
  apply-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.2-alpha-housing-outfits-mounts
          fetch-depth: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Apply authoritative world clock and contextual skills
        run: python3 tools/apply-moria-9-2-day-night-contextual-skills.py
      - name: Install client dependencies
        run: npm ci
      - name: Audit client dependencies
        run: npm audit
      - name: Typecheck client
        run: npm run typecheck
      - name: Build client
        run: npm run build
      - name: Install server dependencies
        run: npm ci --prefix server --no-fund
      - name: Audit server dependencies
        run: npm audit --prefix server
      - name: Check server syntax
        run: npm run check --prefix server
      - name: Run full server suite
        run: npm test --prefix server
      - name: Commit validated systems
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/engine/GameState.mjs server/engine/ContentStudio.mjs src/game/network.ts src/game/ServerSync.ts src/game/types.ts src/game/serverContentAdapters.ts src/components/GameScreen.tsx src/game/worldAtmosphere.ts src/components/Tooltip.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(9.2): add authoritative day night and contextual skills"
          git push origin HEAD:moria-9.2-alpha-housing-outfits-mounts
