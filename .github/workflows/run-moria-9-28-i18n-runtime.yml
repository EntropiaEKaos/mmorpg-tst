name: Mor'ia 9.28 PT-BR Runtime Integration
on:
  push:
    branches: [moria-9.28-character-i18n-ptbr]
    paths:
      - 'tools/apply-moria-9-28-i18n-runtime.py'
      - '.github/workflows/run-moria-9-28-i18n-runtime.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.28-character-i18n-ptbr
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply PT-BR runtime integration
        run: python tools/apply-moria-9-28-i18n-runtime.py
      - name: Verify PT-BR source coverage
        run: python tools/audit-moria-9-28-i18n.py
      - name: Install and audit client
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Typecheck and build client
        run: |
          npm run typecheck
          npm run build
      - name: Guard GameScreen budget
        run: |
          bytes=$(wc -c < src/components/GameScreen.tsx)
          echo "GameScreen bytes: $bytes"
          test "$bytes" -lt 170000
      - name: Install and audit server
        run: |
          npm ci --prefix server
          npm audit --prefix server --audit-level=high
      - name: Validate server
        run: |
          npm run check --prefix server
          npm test --prefix server
      - name: Commit validated product integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/i18n/index.ts src/i18n/pt-BR.928.json src/components/LoginScreen.tsx tools/audit-moria-9-28-i18n.py
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "feat(9.28): complete PT-BR presentation runtime"
          git push origin HEAD:moria-9.28-character-i18n-ptbr
