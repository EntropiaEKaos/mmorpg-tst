name: Visual lockfile sync

on:
  push:
    branches:
      - visual/legacy-eldoria-hybrid-pixi-three

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/legacy-eldoria-hybrid-pixi-three
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from pinned package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install resolves
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(visual): sync Pixi Three lockfile'
          git push origin HEAD:visual/legacy-eldoria-hybrid-pixi-three
