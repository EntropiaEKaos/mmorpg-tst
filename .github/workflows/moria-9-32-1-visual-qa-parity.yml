name: Mor'ia 9.32.1 Visual QA Parity
on:
  push:
    branches: [moria-9.28-character-i18n-ptbr]
    paths:
      - 'tools/upgrade-moria-9-32-1-visual-qa-parity.py'
      - '.github/workflows/moria-9-32-1-visual-qa-parity.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.28-character-i18n-ptbr
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply visual QA locale parity
        run: python tools/upgrade-moria-9-32-1-visual-qa-parity.py
      - name: Verify parity anchors and documentation
        run: |
          grep -q "import LocaleBridge" src/visualQa.tsx
          grep -q "<LocaleBridge />" src/visualQa.tsx
          grep -q "forbiddenByPanel" tools/capture-moria-9-32.mjs
          grep -q "9.32.1 — Paridade do Visual QA" docs/MORIA_9_32_LIBRARY_MAIL_SOCIAL_PTBR.md
      - name: Validate client
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm run build
      - name: Validate server
        run: |
          npm ci --prefix server
          npm audit --prefix server --audit-level=high
          npm run check --prefix server
          npm test --prefix server
      - name: Install visual QA browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture PT-BR screenshots with leak assertions
        run: |
          rm -rf artifacts/moria-9.32-screenshots
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/moria-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/visual-qa.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/visual-qa.html >/dev/null
          node tools/capture-moria-9-32.mjs
          test -s artifacts/moria-9.32-screenshots/library.png
          test -s artifacts/moria-9.32-screenshots/mail.png
          test -s artifacts/moria-9.32-screenshots/social.png
      - name: Upload corrected screenshots
        uses: actions/upload-artifact@v4
        with:
          name: moria-9.32.1-screenshots
          path: artifacts/moria-9.32-screenshots/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Commit validated visual QA parity fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/visualQa.tsx tools/capture-moria-9-32.mjs docs/MORIA_9_32_LIBRARY_MAIL_SOCIAL_PTBR.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(9.32.1): align visual QA locale with game runtime'
          git push origin HEAD:moria-9.28-character-i18n-ptbr
