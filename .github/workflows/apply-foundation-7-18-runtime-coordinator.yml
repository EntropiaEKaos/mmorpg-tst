name: Apply Foundation 7.18 Official Runtime Coordinator

on:
  push:
    branches: [mvp-foundation-7.0]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp-foundation-7.0
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply official runtime coordinator wiring
        run: python3 tools/apply-foundation-7-18-runtime-coordinator.py
      - name: Validate runtime coordinator boundaries
        run: |
          test -f server/engine/OfficialRuntimeCoordinator.mjs
          grep -q "officialRuntimeCoordinator" server/engine/OfficialSystems.mjs
          grep -q "return officialRuntimeCoordinator.onMonsterKill" server/engine/OfficialSystems.mjs
          grep -q "return officialRuntimeCoordinator.tickPlayer" server/engine/OfficialSystems.mjs
          ! grep -q "const key = officialCombatAugmentationDomain.recordBestiaryKill" server/engine/OfficialSystems.mjs
          grep -q "deterministic order" server/test/official-runtime-coordinator.test.mjs
          grep -q "one normalized timestamp" server/test/official-runtime-coordinator.test.mjs
      - name: Validate all gates
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          npm ci --prefix server --no-fund
          npm audit --prefix server
          npm run check --prefix server
          npm test --prefix server
      - name: Commit validated Foundation 7.18 runtime coordinator
        run: |
          if git diff --quiet -- server docs; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server docs
          git commit -m "refactor(official): extract runtime coordinator"
          git restore tools || true
          git fetch origin mvp-foundation-7.0
          git rebase origin/mvp-foundation-7.0
          git push origin HEAD:mvp-foundation-7.0
