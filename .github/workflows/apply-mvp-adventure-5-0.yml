name: Apply MVP Adventure 5.0

on:
  push:
    branches: [mvp-adventure-5.0]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp-adventure-5.0
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply MVP Adventure 5.0
        run: python3 tools/apply-mvp-adventure-5-0.py
      - name: Validate adventure invariants
        run: |
          grep -q "class AdventureEngine" server/engine/AdventureEngine.mjs
          grep -q "adventure_start" server/engine/GameState.mjs
          grep -q "adventure: adventureEngine.exportState" server/server.js
          grep -q "sendAdventureStart" src/game/ServerSync.ts
          grep -q "HUNT BOARD" src/components/AdventureBoard.tsx
          grep -q "adventureState?.active" src/components/GameScreen.tsx
          grep -q "every third claim awards equipment cache" server/test/adventure.test.mjs
      - name: Validate all gates
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          npm install --prefix server --no-fund
          npm audit --prefix server
          npm run check --prefix server
          npm test --prefix server
      - name: Commit validated MVP Adventure 5.0
        run: |
          if git diff --quiet -- server src docs; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server src docs
          git commit -m "feat(mvp): add authoritative Hunt Board adventure loop"
          git restore tools
          git fetch origin mvp-adventure-5.0
          git rebase origin/mvp-adventure-5.0
          git push origin HEAD:mvp-adventure-5.0
