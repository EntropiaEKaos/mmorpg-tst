name: Moria 9.10 Screenshot Finalizer
on:
  push:
    branches:
      - moria-9.9-elemental-scaling-tooltips
    paths:
      - tools/moria-9-10.trigger
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.9-elemental-scaling-tooltips
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build validated client
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
      - name: Install browser harness
        run: |
          mkdir -p /tmp/moria910-shot
          cd /tmp/moria910-shot
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --no-fund --no-audit
          npx playwright install --with-deps chromium
      - name: Capture 9.10 tooltip
        run: |
          python3 -m http.server 4173 -d dist >/tmp/moria910-http.log 2>&1 &
          cat > /tmp/moria910-shot/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1440,height:900}});
          const lines = [];
          page.on('console', m => lines.push(`[${m.type()}] ${m.text()}`));
          page.on('pageerror', e => lines.push(`[pageerror] ${e.message}`));
          await page.goto('http://127.0.0.1:4173', {waitUntil:'networkidle'});
          await page.getByRole('button', {name:/OFFLINE QUICK PLAY/i}).click();
          await page.waitForSelector('canvas', {state:'visible',timeout:15000});
          await page.waitForTimeout(2500);
          const slot = page.locator('.moria-hotbar-slot').first();
          await slot.dispatchEvent('mouseenter');
          await slot.dispatchEvent('mouseover');
          await page.getByText('Reactive combos', {exact:true}).waitFor({state:'visible',timeout:5000});
          fs.mkdirSync('docs/screenshots', {recursive:true});
          await page.screenshot({path:'docs/screenshots/moria-9-10-elemental-reactions-tooltip.png',fullPage:false});
          fs.writeFileSync('/tmp/moria910-browser-console.txt', lines.join('\n'));
          if (lines.some(line => line.includes('[pageerror]') || line.includes('[error]'))) throw new Error(lines.join('\n'));
          await browser.close();
          EOF
          node /tmp/moria910-shot/capture.mjs
      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/moria-9-10-elemental-reactions-tooltip.png
          git commit -m "docs(9.10): add validated elemental reactions screenshot"
          git push origin HEAD:moria-9.9-elemental-scaling-tooltips
      - uses: actions/upload-artifact@v4
        with:
          name: moria-9-10-elemental-reactions-final-review
          path: |
            docs/screenshots/moria-9-10-elemental-reactions-tooltip.png
            /tmp/moria910-browser-console.txt
          retention-days: 7
