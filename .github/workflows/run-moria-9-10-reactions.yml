name: Mor'ia 9.10 Elemental Reactions
on:
  push:
    branches: [moria-9.9-elemental-scaling-tooltips]
    paths: [tools/moria-9-10.trigger]
permissions:
  contents: write
jobs:
  validate-capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.9-elemental-scaling-tooltips
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Mor'ia 9.10 reactions
        run: |
          python3 tools/apply-moria-9-10-reactions.py
          python3 tools/fix-moria-9-10-test-precision.py
      - name: Validate client and server
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          BYTES=$(wc -c < src/components/GameScreen.tsx); echo "GameScreen bytes=$BYTES"; test "$BYTES" -le 155000
          npm ci --prefix server --no-fund
          npm audit --prefix server
          npm run check --prefix server
          npm test --prefix server
      - name: Commit validated 9.10 product
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json server/package.json server/package-lock.json server/engine/CombatDepth.mjs server/engine/ElementalReactions.mjs server/engine/GameState.mjs server/test/elemental-reactions-9-10.test.mjs src/game/elementalReactions.ts src/components/Tooltip.tsx
          git commit -m "feat(9.10): authoritative elemental reactions and combo tooltips"
          git push origin HEAD:moria-9.9-elemental-scaling-tooltips
      - name: Install browser harness
        run: |
          mkdir -p /tmp/moria910-shot && cd /tmp/moria910-shot
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --no-fund --no-audit
          npx playwright install --with-deps chromium
      - name: Capture reaction tooltip
        run: |
          python3 -m http.server 4173 -d dist >/tmp/moria910-http.log 2>&1 &
          cat > /tmp/moria910-shot/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const lines=[]; page.on('console',m=>lines.push(`[${m.type()}] ${m.text()}`)); page.on('pageerror',e=>lines.push(`[pageerror] ${e.message}`));
          await page.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'});
          await page.getByRole('button',{name:/OFFLINE QUICK PLAY/i}).click();
          await page.waitForSelector('canvas',{state:'visible',timeout:15000}); await page.waitForTimeout(2500);
          const slot=page.locator('.moria-hotbar-slot').first();
          await slot.dispatchEvent('mouseenter'); await slot.dispatchEvent('mouseover');
          await page.getByText('Reactive combos',{exact:true}).waitFor({state:'visible',timeout:5000});
          fs.mkdirSync('docs/screenshots',{recursive:true});
          await page.screenshot({path:'docs/screenshots/moria-9-10-elemental-reactions-tooltip.png',fullPage:false});
          fs.mkdirSync('/tmp/moria910-capture',{recursive:true});
          fs.copyFileSync('docs/screenshots/moria-9-10-elemental-reactions-tooltip.png','/tmp/moria910-capture/moria-9-10-elemental-reactions-tooltip.png');
          fs.writeFileSync('/tmp/moria910-capture/browser-console.txt',lines.join('\n'));
          if(lines.some(line=>line.includes('[pageerror]')||line.includes('[error]'))) throw new Error(lines.join('\n'));
          await browser.close();
          EOF
          node /tmp/moria910-shot/capture.mjs
      - name: Add screenshot to README and commit evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md'); s=p.read_text()
          s=s.replace("<p><b>Versão atual: Mor'ia 9.6 — World Identity & City Designer</b></p>","<p><b>Versão atual: Mor'ia 9.10 — Elemental Reactions</b></p>",1)
          marker="## 🏙️ Mor'ia 9.6 — World Identity & City Designer"
          section="""## ⚡ Mor'ia 9.10 — Elemental Reactions\n\nA 9.10 transforma as escolas de dano da 9.9 em um sistema de estados e reações autoritativas. Água pode aplicar **Wet**; Raio sobre Wet dispara **Conductive Burst**; Gelo sobre Wet causa **Flash Freeze**; Físico quebra Frozen com **Shatter**; Terra cria **Fractured**; Arcano aplica **Unstable**; Morte aplica **Cursed**; Sagrado purifica Cursed e recebe bônus contra inimigos alinhados à Morte; Natureza e Veneno formam **Toxic/Venom Bloom**.\n\nOs multiplicadores são resolvidos no servidor antes da defesa final, os estados têm duração limitada e o tooltip da spell mostra as combinações possíveis em **Reactive combos**, junto da cadeia de atributos/equipamentos da 9.9.\n\n### Tooltip real — reações elementais\n\n![Mor'ia 9.10 Elemental Reactions tooltip](docs/screenshots/moria-9-10-elemental-reactions-tooltip.png)\n\n---\n\n"""
          if marker not in s: raise SystemExit('README marker missing')
          if "## ⚡ Mor'ia 9.10 — Elemental Reactions" not in s: s=s.replace(marker,section+marker,1)
          docs="- ⚡ **[Mor'ia 9.10 — Elemental Reactions](docs/screenshots/moria-9-10-elemental-reactions-tooltip.png)** — Reações elementais autoritativas e screenshot real do tooltip de combos.\n"
          doc_marker="## 📜 Licença"
          if docs not in s and doc_marker in s: s=s.replace(doc_marker,docs+'\n---\n\n'+doc_marker,1)
          p.write_text(s)
          PY
          git pull --rebase origin moria-9.9-elemental-scaling-tooltips
          git add README.md docs/screenshots/moria-9-10-elemental-reactions-tooltip.png
          git commit -m "docs(9.10): embed validated reaction screenshot in README"
          git push origin HEAD:moria-9.9-elemental-scaling-tooltips
      - uses: actions/upload-artifact@v4
        with:
          name: moria-9-10-elemental-reactions-review
          path: /tmp/moria910-capture
          retention-days: 7
      - name: Remove temporary release tooling
        run: |
          git pull --rebase origin moria-9.9-elemental-scaling-tooltips
          git rm -f .github/workflows/run-moria-9-10-reactions.yml tools/apply-moria-9-10-reactions.py tools/fix-moria-9-10-test-precision.py tools/moria-9-10.trigger
          git commit -m "chore(9.10): remove temporary reaction release tooling"
          git push origin HEAD:moria-9.9-elemental-scaling-tooltips
