name: Mor'ia 9.10 Elemental Reactions Finalize
on:
  push:
    branches: [moria-9.9-elemental-scaling-tooltips]
    paths: [tools/moria-9-10.trigger]
permissions:
  contents: write
jobs:
  validate-capture-finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.9-elemental-scaling-tooltips
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate final 9.10 client and server
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          BYTES=$(wc -c < src/components/GameScreen.tsx); echo "GameScreen bytes=$BYTES"; test "$BYTES" -le 155000
          npm ci --prefix server --no-fund
          npm audit --prefix server
          npm run check --prefix server
          npm test --prefix server
      - name: Install isolated browser harness
        run: |
          mkdir -p /tmp/moria910-shot && cd /tmp/moria910-shot
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --no-fund --no-audit
          npx playwright install --with-deps chromium
      - name: Capture validated reaction tooltip
        run: |
          python3 -m http.server 4173 -d dist >/tmp/moria910-http.log 2>&1 &
          cat > /tmp/moria910-shot/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const lines=[];
          page.on('console',m=>lines.push(`[${m.type()}] ${m.text()}`));
          page.on('pageerror',e=>lines.push(`[pageerror] ${e.message}`));
          await page.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'});
          await page.getByRole('button',{name:/OFFLINE QUICK PLAY/i}).click();
          await page.waitForSelector('canvas',{state:'visible',timeout:15000});
          await page.waitForTimeout(2500);
          const slot=page.locator('.moria-hotbar-slot').first();
          await slot.dispatchEvent('mouseenter');
          await slot.dispatchEvent('mouseover');
          await page.getByText('Reactive combos',{exact:true}).waitFor({state:'visible',timeout:5000});
          fs.mkdirSync('docs/screenshots',{recursive:true});
          const shot='docs/screenshots/moria-9-10-elemental-reactions-tooltip.png';
          await page.screenshot({path:shot,fullPage:false});
          fs.mkdirSync('/tmp/moria910-capture',{recursive:true});
          fs.copyFileSync(shot,'/tmp/moria910-capture/moria-9-10-elemental-reactions-tooltip.png');
          fs.writeFileSync('/tmp/moria910-capture/browser-console.txt',lines.join('\n'));
          if(lines.some(line=>line.includes('[pageerror]')||line.includes('[error]'))) throw new Error(lines.join('\n'));
          await browser.close();
          EOF
          node /tmp/moria910-shot/capture.mjs
      - name: Embed every 9.10 screenshot in README
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md'); s=p.read_text()
          old="<p><b>Versão atual: Mor'ia 9.6 — World Identity & City Designer</b></p>"
          new="<p><b>Versão atual: Mor'ia 9.10 — Elemental Reactions</b></p>"
          if old in s: s=s.replace(old,new,1)
          marker="## 🏙️ Mor'ia 9.6 — World Identity & City Designer"
          section="""## ⚡ Mor'ia 9.10 — Elemental Reactions

A 9.10 transforma as escolas de dano da 9.9 em um sistema de estados e reações autoritativas. Água pode aplicar **Wet**; Raio sobre Wet dispara **Conductive Burst**; Gelo sobre Wet causa **Flash Freeze**; Físico quebra Frozen com **Shatter**; Terra cria **Fractured**; Arcano aplica **Unstable**; Morte aplica **Cursed**; Sagrado purifica Cursed e recebe bônus contra inimigos alinhados à Morte; Natureza e Veneno formam **Toxic/Venom Bloom**.

Os multiplicadores são resolvidos no servidor antes da defesa final, os estados têm duração limitada e o tooltip da spell mostra as combinações possíveis em **Reactive combos**, junto da cadeia de atributos/equipamentos da 9.9.

### Tooltip real — reações elementais

![Mor'ia 9.10 Elemental Reactions tooltip](docs/screenshots/moria-9-10-elemental-reactions-tooltip.png)

---

"""
          if marker not in s: raise SystemExit('README marker missing')
          if "## ⚡ Mor'ia 9.10 — Elemental Reactions" not in s: s=s.replace(marker,section+marker,1)
          p.write_text(s)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: moria-9-10-elemental-reactions-final-review
          path: /tmp/moria910-capture
          retention-days: 7
      - name: Commit evidence and remove temporary release tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/screenshots/moria-9-10-elemental-reactions-tooltip.png
          git rm -f .github/workflows/run-moria-9-10-reactions.yml tools/apply-moria-9-10-reactions.py tools/fix-moria-9-10-test-precision.py tools/moria-9-10.trigger
          git commit -m "docs(9.10): embed final reaction screenshot and clean release tooling"
          git push origin HEAD:moria-9.9-elemental-scaling-tooltips
