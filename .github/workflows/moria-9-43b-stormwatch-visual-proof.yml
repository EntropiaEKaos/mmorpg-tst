name: Mor'ia 9.43B Grand Stormwatch Isle Visual Proof
on:
  push:
    branches: [moria-9.28-character-i18n-ptbr]
    paths:
      - 'tools/upgrade-moria-9-43b-stormwatch-visual-proof.py'
      - '.github/workflows/moria-9-43b-stormwatch-visual-proof.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.28-character-i18n-ptbr
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Mor'ia 9.43B visual proof
        run: |
          python -m py_compile tools/upgrade-moria-9-43b-stormwatch-visual-proof.py
          python tools/upgrade-moria-9-43b-stormwatch-visual-proof.py
      - name: Verify visual proof source contract
        run: |
          set -euxo pipefail
          test -s src/components/GrandStormwatchPanorama.tsx
          test -s tools/capture-moria-9-43b.mjs
          grep -q "variant?: 'swamp' | 'crystal' | 'storm'" src/game/types.ts
          grep -q 'water_storm_' src/game/render.ts
          grep -q 'bridge_storm_' src/game/render.ts
          grep -q 'STORM_TILE_COLORS' src/components/WorldMiniMap.tsx
          grep -q 'data-grand-stormwatch-panorama' src/components/GrandStormwatchPanorama.tsx
          grep -q "panel === 'stormwatch-minimap'" src/visualQa.tsx
          grep -q "panel === 'stormwatch-city-designer'" src/visualQa.tsx
          grep -q "panel === 'stormwatch-panorama'" src/visualQa.tsx
          grep -q 'water<8000' tools/capture-moria-9-43b.mjs
          grep -q 'bridges<180' tools/capture-moria-9-43b.mjs
          grep -q 'darkOcean<6000' tools/capture-moria-9-43b.mjs
          grep -q '9.43B — Prova visual autoritativa' docs/MORIA_9_43_GRAND_STORMWATCH_ISLE.md
      - name: Verify PT-BR source coverage
        run: python tools/audit-moria-9-28-i18n.py
      - name: Validate client
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm run build
          bytes=$(wc -c < src/components/GameScreen.tsx)
          echo "GameScreen bytes: $bytes"
          test "$bytes" -lt 170000
      - name: Validate server
        run: |
          npm ci --prefix server
          npm audit --prefix server --audit-level=high
          npm run check --prefix server
          npm test --prefix server
      - name: Install stable visual QA browser
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Start authoritative QA server and client
        run: |
          rm -f /tmp/moria-943b-content.json /tmp/moria-943b-content.json.tmp
          ADMIN_TOKEN=moria-visual-qa MORIA_CONTENT_DB=/tmp/moria-943b-content.json PORT=3000 npm start --prefix server > /tmp/moria-943b-server.log 2>&1 &
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/moria-943b-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null && curl -fsS http://127.0.0.1:4173/visual-qa.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/health >/dev/null
          maps=$(curl -fsS 'http://127.0.0.1:3000/admin/api/maps?token=moria-visual-qa')
          echo "$maps" | grep -q 'stormwatch_isle'
          echo "$maps" | grep -q 'tempest-archipelago'
          echo "$maps" | grep -q '"width":160'
          echo "$maps" | grep -q '"height":160'
          curl -fsS http://127.0.0.1:4173/visual-qa.html >/dev/null
      - name: Capture and assert Grand Stormwatch visuals
        run: |
          rm -rf artifacts/moria-9.43b-screenshots
          node tools/capture-moria-9-43b.mjs
          test -s artifacts/moria-9.43b-screenshots/stormwatch-minimap.png
          test -s artifacts/moria-9.43b-screenshots/stormwatch-city-designer.png
          test -s artifacts/moria-9.43b-screenshots/stormwatch-panorama.png
          test $(stat -c%s artifacts/moria-9.43b-screenshots/stormwatch-minimap.png) -gt 25000
          test $(stat -c%s artifacts/moria-9.43b-screenshots/stormwatch-city-designer.png) -gt 120000
          test $(stat -c%s artifacts/moria-9.43b-screenshots/stormwatch-panorama.png) -gt 150000
      - name: Upload Mor'ia 9.43B screenshots
        uses: actions/upload-artifact@v4
        with:
          name: moria-9.43b-screenshots
          path: artifacts/moria-9.43b-screenshots/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Commit validated Mor'ia 9.43B pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/types.ts src/game/maps.ts src/game/render.ts src/components/WorldMiniMap.tsx src/components/GrandStormwatchPanorama.tsx src/visualQa.tsx tools/capture-moria-9-43b.mjs docs/MORIA_9_43_GRAND_STORMWATCH_ISLE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(9.43b): add authoritative Grand Stormwatch Isle visual proof'
          git push origin HEAD:moria-9.28-character-i18n-ptbr
