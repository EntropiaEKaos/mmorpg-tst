name: Archive Mor'ia 9.5 Screenshots

on:
  push:
    branches: [moria-9.5-hud-world-polish]

permissions:
  contents: write
  actions: read

jobs:
  archive:
    if: ${{ !startsWith(github.event.head_commit.message, 'docs(9.5): add visual comparison screenshots') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download real gameplay artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/moria-before /tmp/moria-after docs/screenshots
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9666672102/zip > /tmp/moria-before.zip
          unzip -o /tmp/moria-before.zip -d /tmp/moria-before
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9667770473/zip > /tmp/moria-after.zip
          unzip -o /tmp/moria-after.zip -d /tmp/moria-after
          cp /tmp/moria-before/moria-gameplay-9-4.png docs/screenshots/moria-9-4-gameplay-before.png
          cp /tmp/moria-before/moria-login-9-4.png docs/screenshots/moria-9-4-login.png
          cp /tmp/moria-after/moria-gameplay-9-5.png docs/screenshots/moria-9-5-gameplay-after.png
          ls -lh docs/screenshots
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "docs(9.5): add visual comparison screenshots"
          git push origin HEAD:moria-9.5-hud-world-polish
