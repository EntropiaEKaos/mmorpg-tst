name: Apply Foundation 7.4 Commerce Domain

on:
  push:
    branches: [mvp-foundation-7.0]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp-foundation-7.0
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply commerce domain extraction
        run: python3 tools/apply-foundation-7-4-commerce-domain.py
      - name: Validate domain boundaries
        run: |
          grep -q "officialCommerceDomain" server/engine/OfficialSystems.mjs
          grep -q "OfficialCommerceDomain" server/engine/OfficialCommerceDomain.mjs
          grep -q "return officialCommerceDomain.listAuction" server/engine/OfficialSystems.mjs
          grep -q "return officialCommerceDomain.sendMail" server/engine/OfficialSystems.mjs
          ! grep -q "this.global.auctions.push" server/engine/OfficialSystems.mjs
          grep -q "commerce domain mail atomically charges sender" server/test/official-commerce-domain.test.mjs
      - name: Validate all gates
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          npm ci --prefix server --no-fund
          npm audit --prefix server
          npm run check --prefix server
          npm test --prefix server
      - name: Commit validated Foundation 7.4 commerce domain
        run: |
          if git diff --quiet -- server src docs; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server src docs
          git commit -m "refactor(official): extract auction and mail commerce domain"
          git restore tools || true
          git fetch origin mvp-foundation-7.0
          git rebase origin/mvp-foundation-7.0
          git push origin HEAD:mvp-foundation-7.0
