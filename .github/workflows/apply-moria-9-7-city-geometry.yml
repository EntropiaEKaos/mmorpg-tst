name: Apply Mor'ia 9.7 City Geometry
on:
  push:
    branches: [moria-9.7-reference-visual-convergence]
    paths:
      - tools/apply-moria-9-7-authoritative-city-geometry.py
      - .github/workflows/apply-moria-9-7-city-geometry.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 tools/apply-moria-9-7-authoritative-city-geometry.py
      - run: npm ci && npm audit && npm run typecheck && npm run build
      - run: npm ci --prefix server --no-fund && npm audit --prefix server && npm run check --prefix server && npm test --prefix server
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/apply-moria-9-7-authoritative-city-geometry.py
          rm -f .github/workflows/apply-moria-9-7-city-geometry.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(9.7): align edited buildings with city geometry"
          git push origin HEAD:moria-9.7-reference-visual-convergence
