name: "Mor'ia 9.16 Living Realm Visual Gate"

on:
  push:
    branches:
      - moria-9.11-9.16-living-realm
    paths:
      - tools/moria-9-16-capture.trigger

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: moria-9.11-9.16-living-realm
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate production client
        shell: bash
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          bytes=$(wc -c < src/components/GameScreen.tsx)
          echo "GameScreen bytes=$bytes"
          test "$bytes" -le 155000

      - name: Install browser harness
        shell: bash
        run: |
          mkdir -p /tmp/moria916-shot
          cd /tmp/moria916-shot
          npm init -y
          npm install playwright@latest --no-fund --no-audit
          npx playwright install --with-deps chromium
          cp "$GITHUB_WORKSPACE/tools/capture-moria-9-16.mjs" capture.mjs

      - name: Capture Living Realm surfaces
        shell: bash
        run: |
          python3 -m http.server 4173 -d dist >/tmp/moria916-http.log 2>&1 &
          cd /tmp/moria916-shot
          node capture.mjs
          test ! -s /tmp/moria916-capture/browser-errors.txt

      - name: Version screenshots and release documentation
        shell: bash
        run: |
          python3 tools/finalize-moria-9-16-docs.py

      - name: Upload browser review
        uses: actions/upload-artifact@v4
        with:
          name: moria-9-16-living-realm-visual-review
          path: /tmp/moria916-capture
          retention-days: 7

      - name: Commit visual evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/MORIA_9_11_9_16_LIVING_REALM.md docs/screenshots/moria-9-16-*.png
          git commit -m "docs(9.16): version Living Realm browser evidence"
          git push origin HEAD:moria-9.11-9.16-living-realm
