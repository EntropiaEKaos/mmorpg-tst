name: "Mor'ia 9.16 Living Realm Cleanup"

on:
  push:
    branches:
      - moria-9.11-9.16-living-realm
    paths:
      - tools/moria-9-16-capture.trigger

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: moria-9.11-9.16-living-realm
          fetch-depth: 0

      - name: Remove temporary release tooling
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            .github/workflows/capture-moria-9-16-living-realm.yml \
            .github/workflows/run-moria-9-11-16-living-realm.yml \
            tools/apply-moria-9-11-16-living-realm.py \
            tools/harden-moria-9-11-16-living-realm.py \
            tools/fix-moria-9-16-client-map.py \
            tools/fix-moria-9-16-compat.py \
            tools/capture-moria-9-16.mjs \
            tools/finalize-moria-9-16-docs.py \
            tools/moria-9-16.trigger \
            tools/moria-9-16-capture.trigger
          git commit -m "chore(9.16): remove temporary release tooling"
          git push origin HEAD:moria-9.11-9.16-living-realm
