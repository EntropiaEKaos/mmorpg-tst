name: Apply Foundation 7.14 Official State Repository

on:
  push:
    branches: [mvp-foundation-7.0]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp-foundation-7.0
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply official state repository extraction
        run: python3 tools/apply-foundation-7-14-state-repository.py
      - name: Validate official repository boundaries
        run: |
          test -f server/engine/OfficialStateRepository.mjs
          grep -q "new OfficialStateRepository" server/engine/OfficialSystems.mjs
          grep -q "return this.repository.save(this.global)" server/engine/OfficialSystems.mjs
          ! grep -q "fs.writeFileSync" server/engine/OfficialSystems.mjs
          ! grep -q "fs.readFileSync" server/engine/OfficialSystems.mjs
          grep -q "atomically writes normalized durable state" server/test/official-state-repository.test.mjs
          grep -q "fails closed on corrupt JSON" server/test/official-state-repository.test.mjs
      - name: Validate all gates
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          npm ci --prefix server --no-fund
          npm audit --prefix server
          npm run check --prefix server
          npm test --prefix server
      - name: Commit validated Foundation 7.14 state repository
        run: |
          if git diff --quiet -- server src docs; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server src docs
          git commit -m "refactor(official): extract durable state repository"
          git restore tools || true
          git fetch origin mvp-foundation-7.0
          git rebase origin/mvp-foundation-7.0
          git push origin HEAD:mvp-foundation-7.0
