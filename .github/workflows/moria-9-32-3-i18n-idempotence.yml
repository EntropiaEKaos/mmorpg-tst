name: Mor'ia 9.32.3 I18N Idempotence
on:
  push:
    branches: [moria-9.28-character-i18n-ptbr]
    paths:
      - 'tools/upgrade-moria-9-32-3-i18n-idempotence.py'
      - '.github/workflows/moria-9-32-3-i18n-idempotence.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.28-character-i18n-ptbr
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Mor'ia 9.32.3 i18n idempotence
        run: python tools/upgrade-moria-9-32-3-i18n-idempotence.py
      - name: Verify i18n and visual quality anchors
        run: |
          grep -q "escapeRegExp" src/i18n/index.ts
          grep -q "new RegExp" src/i18n/index.ts
          grep -q "unread message" src/components/MailBox.tsx
          grep -q "'Guildaa'" tools/capture-moria-9-32.mjs
          grep -q "'eldoria'" tools/capture-moria-9-32.mjs
          grep -q "9.32.3 — Idempotência da tradução" docs/MORIA_9_32_LIBRARY_MAIL_SOCIAL_PTBR.md
      - name: Verify PT-BR source coverage
        run: python tools/audit-moria-9-28-i18n.py
      - name: Validate client
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm run build
          bytes=$(wc -c < src/components/GameScreen.tsx)
          echo "GameScreen bytes: $bytes"
          test "$bytes" -lt 170000
      - name: Validate server
        run: |
          npm ci --prefix server
          npm audit --prefix server --audit-level=high
          npm run check --prefix server
          npm test --prefix server
      - name: Install stable visual QA browser
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Capture and assert final 9.32 visuals
        run: |
          rm -rf artifacts/moria-9.32.3-screenshots artifacts/moria-9.32-screenshots
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/moria-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/visual-qa.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/visual-qa.html >/dev/null
          node tools/capture-moria-9-32.mjs
          mkdir -p artifacts/moria-9.32.3-screenshots
          cp artifacts/moria-9.32-screenshots/*.png artifacts/moria-9.32.3-screenshots/
          test -s artifacts/moria-9.32.3-screenshots/library.png
          test -s artifacts/moria-9.32.3-screenshots/mail.png
          test -s artifacts/moria-9.32.3-screenshots/social.png
      - name: Upload final 9.32 screenshots
        uses: actions/upload-artifact@v4
        with:
          name: moria-9.32.3-screenshots
          path: artifacts/moria-9.32.3-screenshots/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Commit validated Mor'ia 9.32.3 closure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/i18n/index.ts src/i18n/pt-BR.928.json src/components/MailBox.tsx tools/capture-moria-9-32.mjs docs/MORIA_9_32_LIBRARY_MAIL_SOCIAL_PTBR.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(9.32.3): make PT-BR translation idempotent'
          git push origin HEAD:moria-9.28-character-i18n-ptbr
