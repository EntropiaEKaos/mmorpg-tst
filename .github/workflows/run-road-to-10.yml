name: Mor'ia 9.17-9.26 Road to 10
on:
  push:
    branches: [moria-9.17-9.26-road-to-10]
    paths:
      - 'tools/road-to-10.trigger'
      - '.github/workflows/run-road-to-10.yml'
permissions:
  contents: write
jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.17-9.26-road-to-10
          fetch-depth: 0
      - name: Update Road to 10 README
        run: python tools/update-road-to-10-docs.py
      - name: Validate readiness dossier and screenshots
        run: |
          test -s docs/MORIA_10_READINESS.md
          grep -q "308/308" docs/MORIA_10_READINESS.md
          grep -q "Mor'ia 9.26.1 — Road to 10 Candidate" README.md
          test "$(find docs/screenshots -maxdepth 1 -name 'moria-9-1[7-9]-*.png' -o -name 'moria-9-2[0-6]-*.png' | wc -l)" -ge 10
      - name: Commit Road to 10 release documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/MORIA_10_READINESS.md
          if git diff --cached --quiet; then echo 'Road to 10 docs already current'; exit 0; fi
          git commit -m 'docs(9.26.1): publish Road to 10 release dossier'
          git push origin HEAD:moria-9.17-9.26-road-to-10
