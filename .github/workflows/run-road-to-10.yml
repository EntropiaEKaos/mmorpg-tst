name: Mor'ia 9.26.1 Release Tree Cleanup
on:
  push:
    branches: [moria-9.17-9.26-road-to-10]
    paths:
      - '.github/workflows/run-road-to-10.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.17-9.26-road-to-10
          fetch-depth: 0
      - name: Verify durable Road to 10 release assets
        run: |
          test -s docs/MORIA_10_READINESS.md
          grep -q "308/308" docs/MORIA_10_READINESS.md
          grep -q "ROAD_TO_TEN_VERSION='9.26.1'" server/engine/RoadToTenDomain.mjs
          test -s server/test/road-to-ten-9-26-1-pre10.test.mjs
          for f in docs/screenshots/moria-9-17-integration.png docs/screenshots/moria-9-18-regional-economy.png docs/screenshots/moria-9-19-profession-specialization.png docs/screenshots/moria-9-20-beast-care.png docs/screenshots/moria-9-21-faction-politics.png docs/screenshots/moria-9-22-siege-warfare.png docs/screenshots/moria-9-23-dynamic-world.png docs/screenshots/moria-9-24-dungeon-blueprints.png docs/screenshots/moria-9-25-quest-consequences.png docs/screenshots/moria-9-26-housing-services.png; do test -s "$f"; done
      - name: Remove one-shot applicators and review workflows
        run: |
          git rm \
            .github/workflows/capture-road-to-10.yml \
            .github/workflows/run-road-to-10.yml \
            tools/apply-road-to-10-integration.py \
            tools/capture-road-to-10.mjs \
            tools/close-road-to-10-pre10.py \
            tools/harden-road-to-10-runtime.py \
            tools/road-to-10.trigger \
            tools/update-road-to-10-docs.py \
            tools/verify-pre10-closure.py
      - name: Commit clean release tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(9.26.1): remove temporary Road to 10 tooling'
          git push origin HEAD:moria-9.17-9.26-road-to-10
