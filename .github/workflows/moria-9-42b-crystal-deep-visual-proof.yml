name: Mor'ia 9.42B Grand Crystal Deep Visual Proof
on:
  push:
    branches: [moria-9.28-character-i18n-ptbr]
    paths:
      - 'tools/upgrade-moria-9-42b-crystal-deep-visual-proof.py'
      - 'tools/fix-moria-9-42b-crystal-selector.py'
      - '.github/workflows/moria-9-42b-crystal-deep-visual-proof.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.28-character-i18n-ptbr
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate and apply Mor'ia 9.42B visual proof
        run: |
          python -m py_compile tools/upgrade-moria-9-42b-crystal-deep-visual-proof.py tools/fix-moria-9-42b-crystal-selector.py
          python tools/upgrade-moria-9-42b-crystal-deep-visual-proof.py
          python tools/fix-moria-9-42b-crystal-selector.py
      - name: Verify visual proof source contract
        run: |
          set -euxo pipefail
          test -s src/components/GrandCrystalDeepPanorama.tsx
          test -s tools/capture-moria-9-42b.mjs
          grep -q 'data-grand-crystal-deep-panorama' src/components/GrandCrystalDeepPanorama.tsx
          grep -q 'data-wall-count' src/components/GrandCrystalDeepPanorama.tsx
          grep -q 'data-floor-count' src/components/GrandCrystalDeepPanorama.tsx
          grep -q 'data-path-count' src/components/GrandCrystalDeepPanorama.tsx
          grep -q "panel === 'crystal-deep-minimap'" src/visualQa.tsx
          grep -q "panel === 'crystal-deep-city-designer'" src/visualQa.tsx
          grep -q "panel === 'crystal-deep-panorama'" src/visualQa.tsx
          grep -q 'crystaldeep_east_lift_gate' tools/capture-moria-9-42b.mjs
          grep -q 'walls<11000' tools/capture-moria-9-42b.mjs
          grep -q 'floors<2200' tools/capture-moria-9-42b.mjs
          grep -q 'paths<1000' tools/capture-moria-9-42b.mjs
          grep -q 'darkBedrock<7000' tools/capture-moria-9-42b.mjs
          grep -q 'cyanGlow<250' tools/capture-moria-9-42b.mjs
          grep -q 'violet<700' tools/capture-moria-9-42b.mjs
          grep -q '9.42B — Prova visual autoritativa' docs/MORIA_9_42_GRAND_CRYSTAL_DEEP.md
      - name: Verify PT-BR source coverage
        run: python tools/audit-moria-9-28-i18n.py
      - name: Validate client
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm run build
          bytes=$(wc -c < src/components/GameScreen.tsx)
          echo "GameScreen bytes: $bytes"
          test "$bytes" -lt 170000
      - name: Validate server
        run: |
          npm ci --prefix server
          npm audit --prefix server --audit-level=high
          npm run check --prefix server
          npm test --prefix server
      - name: Install stable visual QA browser
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Start authoritative QA server and client
        run: |
          rm -f /tmp/moria-942b-content.json /tmp/moria-942b-content.json.tmp
          ADMIN_TOKEN=moria-visual-qa MORIA_CONTENT_DB=/tmp/moria-942b-content.json PORT=3000 npm start --prefix server > /tmp/moria-942b-server.log 2>&1 &
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/moria-942b-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null && curl -fsS http://127.0.0.1:4173/visual-qa.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/health >/dev/null
          maps=$(curl -fsS 'http://127.0.0.1:3000/admin/api/maps?token=moria-visual-qa')
          echo "$maps" | grep -q 'crystal_deep'
          echo "$maps" | grep -q 'geode-chambers'
          echo "$maps" | grep -q '"width":160'
          echo "$maps" | grep -q '"height":160'
          curl -fsS http://127.0.0.1:4173/visual-qa.html >/dev/null
      - name: Capture and assert Grand Crystal Deep visuals
        run: |
          rm -rf artifacts/moria-9.42b-screenshots
          node tools/capture-moria-9-42b.mjs
          test -s artifacts/moria-9.42b-screenshots/crystal-deep-minimap.png
          test -s artifacts/moria-9.42b-screenshots/crystal-deep-city-designer.png
          test -s artifacts/moria-9.42b-screenshots/crystal-deep-panorama.png
          test $(stat -c%s artifacts/moria-9.42b-screenshots/crystal-deep-minimap.png) -gt 25000
          test $(stat -c%s artifacts/moria-9.42b-screenshots/crystal-deep-city-designer.png) -gt 120000
          test $(stat -c%s artifacts/moria-9.42b-screenshots/crystal-deep-panorama.png) -gt 140000
      - name: Upload Mor'ia 9.42B screenshots
        uses: actions/upload-artifact@v4
        with:
          name: moria-9.42b-screenshots
          path: artifacts/moria-9.42b-screenshots/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Commit validated Mor'ia 9.42B pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/GrandCrystalDeepPanorama.tsx src/visualQa.tsx tools/capture-moria-9-42b.mjs docs/MORIA_9_42_GRAND_CRYSTAL_DEEP.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(9.42b): add authoritative Grand Crystal Deep visual proof'
          git push origin HEAD:moria-9.28-character-i18n-ptbr
