name: Mor'ia 9.40A Grand Shadowfen
on:
  push:
    branches: [moria-9.28-character-i18n-ptbr]
    paths:
      - 'tools/upgrade-moria-9-40a-grand-shadowfen.py'
      - 'tools/fix-moria-9-40a-fresh-shadowfen.py'
      - 'tools/fix-moria-9-40a-east-gate.py'
      - 'tools/fix-moria-9-40a-legacy-tests-and-travel.py'
      - '.github/workflows/moria-9-40a-grand-shadowfen.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.28-character-i18n-ptbr
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Mor'ia 9.40A Grand Shadowfen
        run: |
          python -m py_compile tools/upgrade-moria-9-40a-grand-shadowfen.py tools/fix-moria-9-40a-fresh-shadowfen.py tools/fix-moria-9-40a-east-gate.py tools/fix-moria-9-40a-legacy-tests-and-travel.py
          python tools/upgrade-moria-9-40a-grand-shadowfen.py
          python tools/fix-moria-9-40a-fresh-shadowfen.py
          python tools/fix-moria-9-40a-east-gate.py
          python tools/fix-moria-9-40a-legacy-tests-and-travel.py
      - name: Verify Grand Shadowfen source contract
        run: |
          set -euxo pipefail
          for file in server/engine/GrandShadowfen.mjs server/test/grand-shadowfen-9-40.test.mjs docs/MORIA_9_40_GRAND_SHADOWFEN.md; do test -s "$file"; done
          grep -Fq "GRAND_CAPITAL_SCHEMA_VERSION = 6" server/engine/GrandShadowfen.mjs
          grep -Fq "urbanPlan:'marsh-wards'" server/engine/GrandShadowfen.mjs
          grep -Fq "landmarks.length,42" server/test/grand-shadowfen-9-40.test.mjs
          grep -Fq "marshWardsTile" server/engine/World.mjs
          grep -Fq "marshWardsTile" src/game/maps.ts
          grep -Fq "westCanal" server/engine/World.mjs
          grep -Fq "eastCanal" server/engine/World.mjs
          grep -Fq "crossCanal" server/engine/World.mjs
          grep -Fq "eastGate" server/engine/World.mjs
          grep -Fq "eastGate" src/game/maps.ts
          grep -Fq "urbanPlans" server/engine/ContentStudio.mjs
          grep -Fq "migrateGrandShadowfenData" server/engine/ContentDB.mjs
          test "$(grep -Fc 'migrateGrandShadowfenData(this.data);' server/engine/ContentDB.mjs)" -ge 2
          grep -Fq "GRAND_SHADOWFEN_MAP" server/engine/AlphaContent.mjs
          grep -Fq "targetMap:'shadowfen', targetX:80, targetY:138" server/engine/GrandEldoria.mjs
          grep -Fq "world.getMap('emberhold').width" server/test/grand-capital-foundation-9-35.test.mjs
          grep -Fq "data.grandCapitalVersion>=GRAND_CAPITAL_SCHEMA_VERSION" server/test/grand-frostpeak-9-39.test.mjs
          grep -Fq "const voidPortal = WORLD.getMap('shadowfen').portals.find" server/test/hardening.test.mjs
          node --check server/engine/GrandShadowfen.mjs
          node --check server/engine/World.mjs
          node --check server/engine/ContentDB.mjs
      - name: Verify PT-BR source coverage
        run: python tools/audit-moria-9-28-i18n.py
      - name: Validate client
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm run build
          bytes=$(wc -c < src/components/GameScreen.tsx)
          echo "GameScreen bytes: $bytes"
          test "$bytes" -lt 170000
      - name: Validate focused Grand Shadowfen contract
        run: |
          npm ci --prefix server
          npm audit --prefix server --audit-level=high
          npm run check --prefix server
          node --test server/test/grand-shadowfen-9-40.test.mjs
      - name: Validate complete server suite
        run: npm test --prefix server
      - name: Commit validated Mor'ia 9.40A pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/engine/GrandShadowfen.mjs server/engine/GrandEldoria.mjs server/engine/World.mjs server/engine/AlphaContent.mjs server/engine/ContentDB.mjs src/game/maps.ts server/test/grand-shadowfen-9-40.test.mjs docs/MORIA_9_40_GRAND_SHADOWFEN.md server/test/grand-capital-foundation-9-35.test.mjs server/test/grand-eldoria-9-36.test.mjs server/test/grand-sunreach-9-37.test.mjs server/test/grand-frostpeak-9-39.test.mjs server/test/hardening.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(9.40a): build authoritative Grand Shadowfen'
          git push origin HEAD:moria-9.28-character-i18n-ptbr
