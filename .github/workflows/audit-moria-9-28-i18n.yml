name: Mor'ia 9.28 I18N Audit
on:
  push:
    branches: [moria-9.28-character-i18n-ptbr]
    paths:
      - 'tools/audit-moria-9-28-i18n.py'
      - '.github/workflows/audit-moria-9-28-i18n.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.28-character-i18n-ptbr
      - name: Scan human-facing English candidates
        run: python tools/audit-moria-9-28-i18n.py
      - uses: actions/upload-artifact@v4
        with:
          name: moria-9-28-i18n-visible-audit
          path: |
            i18n-visible-audit.json
            i18n-visible-audit.txt
          retention-days: 30
