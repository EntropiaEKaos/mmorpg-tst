name: Mor'ia 9.34.2 Tooltip Viewport Safety
on:
  push:
    branches: [moria-9.28-character-i18n-ptbr]
    paths:
      - 'tools/upgrade-moria-9-34-2-tooltip-viewport.py'
      - '.github/workflows/moria-9-34-2-tooltip-viewport.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.28-character-i18n-ptbr
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Mor'ia 9.34.2 viewport safety
        run: python tools/upgrade-moria-9-34-2-tooltip-viewport.py
      - name: Verify viewport proof and documentation
        run: |
          grep -q "useLayoutEffect" src/components/Tooltip.tsx
          grep -q "resolveTooltipPosition" src/components/Tooltip.tsx
          grep -q "Tooltip escapes viewport" tools/capture-moria-9-34.mjs
          grep -q "boundingBox" tools/capture-moria-9-34.mjs
          grep -q "revisão humana" docs/MORIA_9_34_2_TOOLTIP_VIEWPORT.md
      - name: Verify PT-BR source coverage
        run: python tools/audit-moria-9-28-i18n.py
      - name: Validate client
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm run build
          bytes=$(wc -c < src/components/GameScreen.tsx)
          echo "GameScreen bytes: $bytes"
          test "$bytes" -lt 170000
      - name: Validate server
        run: |
          npm ci --prefix server
          npm audit --prefix server --audit-level=high
          npm run check --prefix server
          npm test --prefix server
      - name: Install stable visual QA browser
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Capture and assert Mor'ia 9.34.2 visuals
        run: |
          rm -rf artifacts/moria-9.34-screenshots
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/moria-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/visual-qa.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/visual-qa.html >/dev/null
          node tools/capture-moria-9-34.mjs
          test -s artifacts/moria-9.34-screenshots/actionbar.png
          test $(stat -c%s artifacts/moria-9.34-screenshots/actionbar.png) -gt 30000
      - name: Upload Mor'ia 9.34.2 screenshots
        uses: actions/upload-artifact@v4
        with:
          name: moria-9.34.2-screenshots
          path: artifacts/moria-9.34-screenshots/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Commit validated Mor'ia 9.34.2 pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/Tooltip.tsx tools/capture-moria-9-34.mjs docs/MORIA_9_34_2_TOOLTIP_VIEWPORT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(9.34.2): keep tooltips inside viewport'
          git push origin HEAD:moria-9.28-character-i18n-ptbr
