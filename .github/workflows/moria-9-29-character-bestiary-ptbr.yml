name: Mor'ia 9.29 Character + Bestiary PT-BR
on:
  push:
    branches: [moria-9.28-character-i18n-ptbr]
    paths:
      - 'tools/upgrade-moria-9-29-character-bestiary-ptbr.py'
      - '.github/workflows/moria-9-29-character-bestiary-ptbr.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.28-character-i18n-ptbr
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Mor'ia 9.29 character and bestiary pass
        run: python tools/upgrade-moria-9-29-character-bestiary-ptbr.py
      - name: Verify upgrade anchors
        run: |
          grep -q 'size="hero"' src/components/CharacterPanel.tsx
          grep -q "tr(selectedEntry.description)" src/components/Bestiary.tsx
          grep -q "type PortraitSize = 'card' | 'hero'" src/components/VocationPortrait.tsx
      - name: Verify PT-BR source coverage
        run: python tools/audit-moria-9-28-i18n.py
      - name: Validate client
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm run build
          bytes=$(wc -c < src/components/GameScreen.tsx)
          echo "GameScreen bytes: $bytes"
          test "$bytes" -lt 170000
      - name: Validate server
        run: |
          npm ci --prefix server
          npm audit --prefix server --audit-level=high
          npm run check --prefix server
          npm test --prefix server
      - name: Commit validated Mor'ia 9.29 pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/i18n/pt-BR.928.json src/components/VocationPortrait.tsx src/components/Bestiary.tsx src/components/CharacterPanel.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(9.29): upgrade character sheet and localize bestiary'
          git push origin HEAD:moria-9.28-character-i18n-ptbr
