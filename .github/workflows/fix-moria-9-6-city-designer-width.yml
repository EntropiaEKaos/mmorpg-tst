name: Fix Mor'ia 9.6 City Designer Width

on:
  push:
    branches: [moria-9.6-world-identity-city-editor]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Expand editor workspace safely
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/GameEditor.tsx')
          text = path.read_text(encoding='utf-8')
          old = 'className="rounded-lg border-2 p-4 max-w-5xl w-full max-h-[90vh] overflow-hidden flex flex-col"'
          new = 'className="rounded-lg border-2 p-4 max-w-7xl w-full max-h-[90vh] overflow-hidden flex flex-col"'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one Game Editor width anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Validate client
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Commit polish and self-remove
        run: |
          rm .github/workflows/fix-moria-9-6-city-designer-width.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GameEditor.tsx .github/workflows/fix-moria-9-6-city-designer-width.yml
          git commit -m "fix(9.6): expand City Designer workspace"
          git push
