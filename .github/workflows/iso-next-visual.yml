name: ISO Next Visual Evidence

on:
  pull_request:
    branches: [master]
    paths:
      - 'src/game/iso-next/**'
      - 'scripts/iso-next-offline.mjs'
      - '.github/workflows/iso-next-visual.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  visual-evidence:
    if: github.event.pull_request.head.ref == 'feat/moria-iso-next'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install validated client
        run: npm ci
      - name: Audit
        run: npm audit
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install Chromium harness
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run isolated offline visual gate
        run: npm run test:iso-offline
      - name: Validate evidence files
        run: |
          test -s docs/screenshots/iso-next/iso-next-eldoria-day.png
          test -s docs/screenshots/iso-next/iso-next-eldoria-narrow.png
          test -s docs/screenshots/iso-next/offline-report.json
          node -e "const r=require('./docs/screenshots/iso-next/offline-report.json'); if(!r.passed || r.consoleErrors.length) process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: iso-next-visual-evidence-${{ github.event.pull_request.head.sha }}
          path: docs/screenshots/iso-next/
          retention-days: 90
