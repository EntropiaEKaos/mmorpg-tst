name: Mor'ia 9.35B Grand Capital Client
on:
  push:
    branches: [moria-9.28-character-i18n-ptbr]
    paths:
      - 'tools/upgrade-moria-9-35b-grand-capital-client.py'
      - 'tools/fix-moria-9-35b-client-typecheck.py'
      - '.github/workflows/moria-9-35b-grand-capital-client.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.28-character-i18n-ptbr
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Mor'ia 9.35B client scale pass
        run: |
          python tools/upgrade-moria-9-35b-grand-capital-client.py
          python tools/fix-moria-9-35b-client-typecheck.py
      - name: Verify dimension-aware client architecture
        run: |
          grep -q "MAX_MAP_DIMENSION = 192" src/game/maps.ts
          grep -q "getMapDimensions" src/game/maps.ts
          grep -q "data-map-width={mapWidth}" src/components/WorldMiniMap.tsx
          grep -q "data-city-designer-preview" src/components/CityDesigner.tsx
          grep -q "landmarkLimit = isCapital ? 64 : 12" src/components/CityDesigner.tsx
          grep -q "qa_grand_capital" src/visualQa.tsx
          grep -q "Bastião do Horizonte" tools/capture-moria-9-35b.mjs
          grep -q "9.36 Grand Eldoria" docs/MORIA_9_35_GRAND_CAPITAL_FOUNDATION.md
          ! grep -q "MAP_HEIGHT, MAP_WIDTH" src/components/WorldMiniMap.tsx
      - name: Verify PT-BR source coverage
        run: python tools/audit-moria-9-28-i18n.py
      - name: Validate client
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm run build
          bytes=$(wc -c < src/components/GameScreen.tsx)
          echo "GameScreen bytes: $bytes"
          test "$bytes" -lt 170000
      - name: Validate server
        run: |
          npm ci --prefix server
          npm audit --prefix server --audit-level=high
          npm run check --prefix server
          npm test --prefix server
      - name: Install stable visual QA browser
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Capture and assert Mor'ia 9.35B visuals
        run: |
          rm -rf artifacts/moria-9.35b-screenshots
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/moria-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/visual-qa.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/visual-qa.html >/dev/null
          node tools/capture-moria-9-35b.mjs
          test -s artifacts/moria-9.35b-screenshots/grand-minimap.png
          test -s artifacts/moria-9.35b-screenshots/grand-city-designer.png
          test $(stat -c%s artifacts/moria-9.35b-screenshots/grand-minimap.png) -gt 20000
          test $(stat -c%s artifacts/moria-9.35b-screenshots/grand-city-designer.png) -gt 50000
      - name: Upload Mor'ia 9.35B screenshots
        uses: actions/upload-artifact@v4
        with:
          name: moria-9.35b-screenshots
          path: artifacts/moria-9.35b-screenshots/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Commit validated Mor'ia 9.35B pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/maps.ts src/components/WorldMiniMap.tsx src/components/CityDesigner.tsx src/visualQa.tsx server/test/grand-capital-client-9-35.test.mjs tools/capture-moria-9-35b.mjs docs/MORIA_9_35_GRAND_CAPITAL_FOUNDATION.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(9.35b): make client capital-scale aware'
          git push origin HEAD:moria-9.28-character-i18n-ptbr
