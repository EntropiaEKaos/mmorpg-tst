name: Diagnose Content Expansion 8.0 Transaction Regression

on:
  push:
    branches: [content-expansion-8.0]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content-expansion-8.0
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Shattered Frontier migration
        run: python3 tools/apply-content-expansion-8-0.py
      - name: Capture transaction test output
        run: |
          set +e
          node --test server/test/official-transaction-manager.test.mjs > tools/tx-failure.log 2>&1
          status=$?
          cat tools/tx-failure.log
          if [ "$status" -ne 0 ]; then
            git restore server src docs || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/tx-failure.log
            git commit -m "chore(content): capture transaction regression diagnostic"
            git fetch origin content-expansion-8.0
            git rebase origin/content-expansion-8.0
            git push origin HEAD:content-expansion-8.0
          fi
          exit "$status"
