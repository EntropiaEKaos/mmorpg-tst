name: Apply runtime editor hardening 3.6

on:
  push:
    branches: [hardening-3.1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-3.1
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare editor compatibility
        run: python3 tools/prep-runtime-editor-hardening-3-6.py
      - name: Apply runtime editor hardening
        run: python3 tools/apply-runtime-editor-hardening-3-6.py
      - name: Validate browser/admin invariants
        run: |
          if grep -RE "require[[:space:]]*\([[:space:]]*['\"]" src --include='*.ts' --include='*.tsx'; then
            echo "Executable CommonJS require found in browser source"
            exit 1
          fi
          if grep -q "tibia_accounts" src/components/AdminPanel.tsx; then
            echo "Legacy account material must never be exported by AdminPanel"
            exit 1
          fi
          grep -q "allowLocalAdmin && e.ctrlKey" src/components/GameScreen.tsx
          grep -q "customContentOnMap(customMonstersRef.current, targetMapId)" src/components/GameScreen.tsx
          grep -q "customContentOnMap(customNpcsRef.current, targetMapId)" src/components/GameScreen.tsx
      - name: Validate all gates
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          npm install --prefix server --no-fund
          npm audit --prefix server
          npm run check --prefix server
          npm test --prefix server
      - name: Commit validated runtime/editor fixes
        run: |
          if git diff --quiet -- src; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "feat(admin): harden debug access and wire custom runtime content"
          git restore tools
          git fetch origin hardening-3.1
          git rebase origin/hardening-3.1
          git push origin HEAD:hardening-3.1
