name: Apply Mor'ia 9.7 Entity Labels City Designer V5
on:
  push:
    branches: [moria-9.7-reference-visual-convergence]
    paths:
      - '.github/workflows/apply-moria-9-7-entity-labels-city-designer-v5.yml'
permissions:
  contents: write
jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moria-9.7-reference-visual-convergence
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final smart-label and city-designer pass
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/apply-moria-9-7-entity-labels-city-designer.py')
          s=p.read_text()
          s=s.replace("import { drawBuilding, type Building } from '../game/render';", "import { drawBuilding, drawBuildingOcclusion, type Building } from '../game/render';")
          p.write_text(s)
          PY
          python3 tools/apply-moria-9-7-entity-labels-city-designer.py
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/game/entityNameplates.ts'); s=p.read_text()
          s=s.replace('cx: number, spriteY: number, size: number, npc:', 'cx: number, spriteY: number, npc:')
          s=s.replace('cx: number, spriteY: number, size: number, monster:', 'cx: number, spriteY: number, monster:')
          p.write_text(s)

          p=Path('src/game/render.ts'); s=p.read_text()
          s=s.replace('queueMonsterNameplate(ctx, labelLayout, cx, y, size, monster,', 'queueMonsterNameplate(ctx, labelLayout, cx, y, monster,')
          s=s.replace('queueNpcNameplate(ctx, labelLayout, cx, y, size, npc,', 'queueNpcNameplate(ctx, labelLayout, cx, y, npc,')
          p.write_text(s)

          p=Path('server/adminPanel.mjs'); s=p.read_text()
          bad="const selected=cityDesigner.landmarks[cityDesigner.selected]; const label=document.getElementById('cityDesignerSelection'); if(label) label.textContent=selected ? `${selected.name||selected.id} — x:${selected.x} y:${selected.y} ${selected.w}×${selected.h}` : 'No building selected';"
          good="const selected=cityDesigner.landmarks[cityDesigner.selected]; const label=document.getElementById('cityDesignerSelection'); if(label) label.textContent=selected ? ((selected.name||selected.id)+' — x:'+selected.x+' y:'+selected.y+' '+selected.w+'×'+selected.h) : 'No building selected';"
          if bad not in s: raise SystemExit('admin nested-template anchor missing')
          p.write_text(s.replace(bad, good, 1))

          p=Path('src/components/GameScreen.tsx'); s=p.read_text()
          removable=[
            '    // Deferred NPC/monster/boss labels are resolved after roof occlusion so high-priority\n',
            '    // targets remain readable and overlapping labels are assigned separate vertical lanes.\n',
            '    // NPCs\n','    // Monsters\n','    // Draw current player\n',
            '    // Draw other players — authoritative server data takes priority\n',
            '      // LOCAL/RELAY: draw BroadcastChannel players or simulated bots\n',
            '    // Draw active pet (server-owned online, local state in Quick Play).\n',
            '    // Target highlight\n','    // Projectiles\n',
            '    // Buildings (rendered after tiles, behind entities)\n',
            '    // Houses and decoration are presentation-only projections of global server state.\n',
          ]
          for line in removable: s=s.replace(line,'')
          size=len(s.encode())
          if size > 155000: raise SystemExit(f'GameScreen still exceeds architecture budget: {size}')
          p.write_text(s)
          print('GameScreen bytes:', size)

          # 8.6 contract now verifies the schema-driven JSON editor instead of the retired
          # hard-coded portals/requires branch. This preserves the original structured-JSON intent.
          p=Path('server/test/studio-8-6.test.mjs'); s=p.read_text()
          old="  assert.match(html, /f === 'portals' \\|\\| f === 'requires'/);"
          new="  assert.match(html, /meta\\?\\.kind === 'json'/);\n  assert.match(html, /JSON\\.parse\\(v \\|\\| '\\[\\]'\\)/);"
          if old not in s: raise SystemExit('legacy Studio JSON assertion anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Syntax gate generated Studio
        run: node --check server/adminPanel.mjs
      - name: Validate client
        run: npm ci && npm audit && npm run typecheck && npm run build
      - name: Validate server
        run: npm ci --prefix server --no-fund && npm audit --prefix server && npm run check --prefix server && npm test --prefix server
      - name: Commit validated pass and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/apply-moria-9-7-entity-labels-city-designer.py
          rm -f .github/workflows/apply-moria-9-7-entity-labels-city-designer.yml
          rm -f .github/workflows/apply-moria-9-7-entity-labels-city-designer-v2.yml
          rm -f .github/workflows/apply-moria-9-7-entity-labels-city-designer-v3.yml
          rm -f .github/workflows/apply-moria-9-7-entity-labels-city-designer-v4.yml
          rm -f .github/workflows/apply-moria-9-7-entity-labels-city-designer-v5.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(9.7): add smart entity labels and visual city authoring"
          git push origin HEAD:moria-9.7-reference-visual-convergence
