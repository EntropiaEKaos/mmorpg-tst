name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master, hardening-3.1, mvp-adventure-5.0, mvp-complete-6.0, mvp-foundation-7.0]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: Audit client dependencies
        run: npm audit

      - name: Typecheck client
        run: npm run typecheck

      - name: Build client
        run: npm run build

      - name: Install server dependencies
        run: npm ci --prefix server --no-fund

      - name: Audit server dependencies
        run: npm audit --prefix server

      - name: Check server syntax
        run: npm run check --prefix server

      - name: Run server hardening tests
        run: npm test --prefix server
