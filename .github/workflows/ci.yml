name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [hardening-3.1]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: Build client
        run: npm run build

      - name: Install server dependencies
        run: npm install --prefix server --no-audit --no-fund

      - name: Check server syntax
        run: npm run check --prefix server

      - name: Run server hardening tests
        run: npm test --prefix server
