name: Apply authoritative dialog catalog 3.7

on:
  push:
    branches: [hardening-3.1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-3.1
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply authoritative dialog catalog
        run: python3 tools/apply-authoritative-dialog-catalog-3-7.py
      - name: Validate dialog/runtime invariants
        run: |
          grep -q "questCatalog?: Quest\[\]" src/components/DialogBox.tsx
          grep -q "questCatalog = QUESTS" src/components/DialogBox.tsx
          grep -q "questCatalog={questCatalog}" src/components/GameScreen.tsx
          if grep -q "QUESTS.find(" src/components/DialogBox.tsx; then
            echo "DialogBox still hardcodes client quest metadata"
            exit 1
          fi
          if grep -RE "require[[:space:]]*\([[:space:]]*['\"]" src --include='*.ts' --include='*.tsx'; then
            echo "Executable CommonJS require found in browser source"
            exit 1
          fi
      - name: Validate all gates
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
          npm install --prefix server --no-fund
          npm audit --prefix server
          npm run check --prefix server
          npm test --prefix server
      - name: Commit validated dialog catalog fix
        run: |
          if git diff --quiet -- src; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix(npcs): use authoritative quest catalog in dialogs"
          git restore tools
          git fetch origin hardening-3.1
          git rebase origin/hardening-3.1
          git push origin HEAD:hardening-3.1
